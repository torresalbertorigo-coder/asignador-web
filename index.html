function renderListaHabilidadesProyecto() {
  const list = STATE._np_habilidades || [];
  if (!list.length) return '<div style="font-size:12px;color:var(--text3)">Ninguna agregada — el proyecto no exigirá nivel mínimo de habilidades.</div>';
  return list.map((h,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
    <span>${h.nombre} — nivel mín. ${h.nivel}</span>
    <button class="btn btn-ghost btn-sm" onclick="quitarHabilidadProyecto(${i})" style="padding:2px 6px"><i class="ti ti-x" aria-hidden="true"></i></button>
  </div>`).join('');
}
function agregarHabilidadProyecto() {
  const nombre = document.getElementById('np-hab-nombre')?.value.trim();
  const nivel  = parseInt(document.getElementById('np-hab-nivel')?.value || '5');
  if (!nombre) return;
  if (!STATE._np_habilidades) STATE._np_habilidades = [];
  STATE._np_habilidades = STATE._np_habilidades.filter(h=>h.nombre.toLowerCase()!==nombre.toLowerCase());
  STATE._np_habilidades.push({ nombre, nivel });
  document.getElementById('np-hab-nombre').value = '';
  document.getElementById('np-habs-list').innerHTML = renderListaHabilidadesProyecto();
}
function quitarHabilidadProyecto(i) {
  STATE._np_habilidades.splice(i,1);
  document.getElementById('np-habs-list').innerHTML = renderListaHabilidadesProyecto();
}

function renderListaCertificadosProyecto() {
  const list = STATE._np_certificados || [];
  if (!list.length) return '<div style="font-size:12px;color:var(--text3)">Ninguno agregado — el proyecto no exigirá certificados.</div>';
  return list.map((c,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
    <span>${c}</span>
    <button class="btn btn-ghost btn-sm" onclick="quitarCertificadoProyecto(${i})" style="padding:2px 6px"><i class="ti ti-x" aria-hidden="true"></i></button>
  </div>`).join('');
}
function agregarCertificadoProyecto() {
  const nombre = document.getElementById('np-cert-nombre')?.value.trim();
  if (!nombre) return;
  if (!STATE._np_certificados) STATE._np_certificados = [];
  if (!STATE._np_certificados.includes(nombre)) STATE._np_certificados.push(nombre);
  document.getElementById('np-cert-nombre').value = '';
  document.getElementById('np-certs-list').innerHTML = renderListaCertificadosProyecto();
}
function quitarCertificadoProyecto(i) {
  STATE._np_certificados.splice(i,1);
  document.getElementById('np-certs-list').innerHTML = renderListaCertificadosProyecto();
}

function renderListaEquipoProyecto() {
  const list = STATE._np_equipo || [];

async function guardarNuevoProyecto() {
  const nombre   = document.getElementById('np-nombre')?.value.trim();
  const cliente  = document.getElementById('np-cliente')?.value.trim();
  const crit     = document.getElementById('np-crit')?.value;
  const intens   = document.getElementById('np-intens')?.value;
  const inicio   = document.getElementById('np-inicio')?.value;
  const fin      = document.getElementById('np-fin')?.value;
  const personal = document.getElementById('np-personal')?.value;
  const ciudad   = document.getElementById('np-ciudad')?.value.trim();
  const estadoUb = document.getElementById('np-estado')?.value.trim();
  const coordsTexto = document.getElementById('np-coords')?.value.trim();
  const coordsParseadas = parsearCoordenadas(coordsTexto);
  const presup   = document.getElementById('np-presup')?.value;
  const err      = document.getElementById('np-err');
  if (!nombre || !inicio || !fin || !ciudad) { err.textContent = 'Nombre, fechas y ciudad son obligatorios.'; return; }
  const id_pry = `PRY-${Date.now().toString(36).toUpperCase()}`;
  const habilidades_requeridas = {};
  (STATE._np_habilidades||[]).forEach(h=>{ habilidades_requeridas[h.nombre] = h.nivel; });
  const certificados_requeridos = (STATE._np_certificados||[]).slice();
  const no_requiere_equipo = document.getElementById('np-sin-equipo')?.checked || false;
  const equipo_requerido = no_requiere_equipo ? [] : (STATE._np_equipo||[]).slice();
  const no_requiere_vehiculo = document.getElementById('np-sin-vehiculo')?.checked ?? true;
  const vehiculo_requerido = no_requiere_vehiculo ? [] : (STATE._np_vehiculo||[]).slice();
  const r = await api('POST', '/proyectos/proyectos', {
    id: id_pry, nombre, cliente, criticidad: crit, intensidad: intens,
    fecha_inicio: inicio, fecha_fin_estimada: fin,
    personal_requerido: parseInt(personal)||1,
    presupuesto_viaticos: parseFloat(presup)||0,
    ciudad, estado_ub: estadoUb, pais: 'México',
    latitud: coordsParseadas ? coordsParseadas.lat : 0,
    longitud: coordsParseadas ? coordsParseadas.lon : 0,
    habilidades_requeridas, certificados_requeridos, equipo_requerido, no_requiere_equipo,
    vehiculo_requerido, no_requiere_vehiculo
  });
  if (r) {
    await loadProyectos(true);
    closePanel(null, true);
    toast(`Proyecto "${nombre}" creado`);
    renderProyectos();
    cargarCatalogos();
  } else { err.textContent = 'Error al crear el proyecto.'; }
}

async function renderGantt() {
  await loadEmpleados(); await loadProyectos();
  const today = new Date();
  const dias = 30;
  const cols = Array.from({length:dias}, (_,i) => { const d = new Date(today); d.setDate(d.getDate()-7+i); d.setHours(0,0,0,0); return d; });
  const hoy = today.toDateString();
  const hoy00 = new Date(today); hoy00.setHours(0,0,0,0);
  const horaHoyPct = ((today.getHours()*60+today.getMinutes())/1440*100).toFixed(1);
  html(`
    <div class="table-section" id="gantt-export-area">
      <div class="table-header"><span class="table-title">CALENDARIO DE DISPONIBILIDAD — 30 DÍAS</span><span class="table-meta">hoy: ${today.toLocaleDateString('es-MX')}</span><button class="btn btn-ghost btn-sm" onclick="exportarGanttPDF()" style="margin-left:10px"><i class="ti ti-file-download" aria-hidden="true"></i> Exportar PDF</button></div>
      <div class="gantt-wrap">
        <table class="gantt-table">
          <thead><tr>
            <th style="min-width:140px">TÉCNICO</th>
            ${cols.map(d=>`<th style="min-width:28px;text-align:center;${d.toDateString()===hoy?'color:var(--red)':''}">${d.getDate()}<br><span style="font-size:9px">${['D','L','M','X','J','V','S'][d.getDay()]}</span></th>`).join('')}
          </tr></thead>
          <tbody>
            ${STATE.empleados.map(e=>`<tr>
              <td class="gantt-name" style="cursor:pointer" onclick="abrirCalendarioMensual('${e.id}','${(e.nombre+' '+e.apellido).replace(/'/g,"\\'")}',0)">${e.nombre} ${e.apellido}</td>
              ${cols.map(d=>{
                const isHoy = d.toDateString() === hoy;
                const isWknd = d.getDay()===0||d.getDay()===6;
                const pry = STATE.proyectos.find(p => (p.tecnicos_asignados||[]).includes(e.id) && p.fecha_inicio && p.fecha_fin_estimada && fechaLocal(p.fecha_inicio)<=d && fechaLocal(p.fecha_fin_estimada)>=d);
                let cls = 'gantt-cell' + (isWknd ? ' weekend' : '') + (isHoy ? ' today' : '');
                if (pry) cls += d < hoy00 ? ' past' : ' occupied';
                const tip = pry ? `${pry.nombre}${pry.cliente?' · '+pry.cliente:''} (${pry.fecha_inicio} → ${pry.fecha_fin_estimada})`.replace(/"/g,'&quot;') : '';
                const estilos = [pry ? 'cursor:pointer' : '', isHoy ? `--hoy-pos:${horaHoyPct}%` : ''].filter(Boolean).join(';');
                const click = pry ? ` onclick="verProyecto('${pry.id}')"` : '';
                return `<td class="${cls}" title="${tip}"${click}${estilos?` style="${estilos}"`:''}></td>`;
              }).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div style="padding:12px 16px;display:flex;gap:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)"><div style="width:12px;height:8px;background:var(--gantt-occupied)"></div> Días completados</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)"><div style="width:12px;height:8px;background:var(--gantt-past)"></div> Días pasados (proyecto)</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)"><div style="width:12px;height:8px;background:var(--input-bg);border:1px solid var(--border)"></div> Fin de semana</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)"><div style="width:2px;height:16px;background:var(--red)"></div> Hoy</div>
      </div>
    </div>`);
}

async function exportarGanttPDF() {
  await loadEmpleados(); await loadProyectos();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'letter' });
  const today = new Date();
  const dias = 30;
  const cols = Array.from({length:dias}, (_,i) => { const d = new Date(today); d.setDate(d.getDate()-7+i); d.setHours(0,0,0,0); return d; });
  const diaLetra = ['D','L','M','X','J','V','S'];
  const secciones = [
    { key: 'asignado', label: 'ASIGNADO', color: [34,197,94] },
    { key: 'en_preparacion', label: 'EN PREPARATIVOS', color: [245,158,11] },
    { key: 'pausado', label: 'PAUSADO', color: [249,115,22] },
    { key: 'cancelado', label: 'CANCELADO', color: [156,163,175] },
    { key: 'completado', label: 'COMPLETADO', color: [59,130,246] },
  ];
  const coloresProyecto = Object.fromEntries(secciones.map(s=>[s.key,s.color]));

  doc.setFontSize(14);
  doc.setFont(undefined, 'bold');
  doc.text('Calendario de Disponibilidad — 30 días', 10, 12);
  doc.setFontSize(9);
  doc.setFont(undefined, 'normal');
  doc.text(`Generado el ${today.toLocaleString('es-MX')}`, 10, 18);

  // Matriz de color y de "a quién pertenece" por celda, calculada de antemano
  const matrizColor = [];
  const asignacionesPorSeccion = Object.fromEntries(secciones.map(s=>[s.key, []]));
  const vistos = new Set();
  STATE.empleados.forEach(e => {
    const filaColor = [];
    cols.forEach(d => {
      const isWknd = d.getDay()===0||d.getDay()===6;
      const pry = STATE.proyectos.find(p => (p.tecnicos_asignados||[]).includes(e.id) && p.fecha_inicio && p.fecha_fin_estimada && fechaLocal(p.fecha_inicio)<=d && fechaLocal(p.fecha_fin_estimada)>=d);
      if (pry) {
        const estadoVis = estadoProyectoVisible(pry);
        filaColor.push(coloresProyecto[estadoVis] || [156,163,175]);
        const clave = `${e.id}-${pry.id}`;
        if (!vistos.has(clave) && asignacionesPorSeccion[estadoVis]) {
          vistos.add(clave);
          asignacionesPorSeccion[estadoVis].push(`${e.nombre} ${e.apellido} - ${pry.nombre} (${pry.fecha_inicio} al ${pry.fecha_fin_estimada})`);
        }
      } else if (isWknd) {
        filaColor.push([243,244,246]);
      } else {
        filaColor.push([255,255,255]);
      }
    });
    matrizColor.push(filaColor);
  });

  const head = [['TÉCNICO', ...cols.map(d => `${d.getDate()}\n${diaLetra[d.getDay()]}`)]];
  const body = STATE.empleados.map(e => [`${e.nombre} ${e.apellido}`, ...cols.map(()=>'')]);

  doc.autoTable({
    startY: 22,
    head, body,
    theme: 'grid',
    styles: { fontSize: 6, cellPadding: 1, halign: 'center', lineColor: [220,220,220], lineWidth: 0.1 },
    headStyles: { fillColor: [30,30,33], textColor: 255, fontSize: 6 },
    columnStyles: { 0: { halign: 'left', cellWidth: 38, fontSize: 7 } },
    didParseCell: (data) => {
      if (data.section === 'body' && data.column.index > 0) {
        const color = matrizColor[data.row.index]?.[data.column.index - 1];
        if (color) data.cell.styles.fillColor = color;
      }
    }
  });

  // Leyenda adaptable: solo las secciones que realmente tienen algo, en 2 columnas balanceadas
  let y = doc.lastAutoTable.finalY + 8;
  if (y > 175) { doc.addPage(); y = 15; }
  doc.setFontSize(11);
  doc.setFont(undefined, 'bold');
  doc.setTextColor(0);
  doc.text('Asignaciones dentro de este periodo', 10, y);
  y += 7;

  const seccionesConDatos = secciones.filter(s => asignacionesPorSeccion[s.key].length);
  const colX = [10, 148];       // página landscape carta = 279.4mm; cada columna cabe con margen de sobra
  const colAncho = 122;         // ancho de texto disponible por columna
  const colY = [y, y];
  const maxY = 195;             // límite antes de saltar de página

  const dibujarSeccion = (s, col) => {
    if (colY[col] > maxY - 10) { doc.addPage(); colY[0] = 15; colY[1] = 15; }
    doc.setFillColor(...s.color);
    doc.rect(colX[col], colY[col]-3, 3, 3, 'F');
    doc.setFontSize(9);
    doc.setFont(undefined, 'bold');
    doc.setTextColor(0);
    doc.text(s.label, colX[col]+5, colY[col]);
    colY[col] += 5.5;
    doc.setFontSize(7.5);
    doc.setFont(undefined, 'normal');
    asignacionesPorSeccion[s.key].forEach(linea => {
      const wrapped = doc.splitTextToSize(linea, colAncho);
      wrapped.forEach(l => {
        if (colY[col] > maxY) { doc.addPage(); colY[col] = 15; }
        doc.text(l, colX[col], colY[col]);
        colY[col] += 4;
      });
    });
    colY[col] += 4;
  };

  // Siempre se agrega a la columna que en ese momento esté más corta, para que quede balanceado
  seccionesConDatos.forEach(s => {
    const col = colY[0] <= colY[1] ? 0 : 1;
    dibujarSeccion(s, col);
  });

  doc.setFontSize(7);
  doc.setTextColor(120);
  const leyendaColores = seccionesConDatos.map(s => `${['Verde','Ámbar','Naranja','Gris','Azul'][secciones.indexOf(s)]} = ${s.label.toLowerCase()}`).join(' · ');
  if (leyendaColores) doc.text(leyendaColores, 10, 285);

  doc.save(`Gantt General - ${today.toISOString().split('T')[0]}.pdf`);
}

async function exportarCalendarioEmpleadoPDF(elementId, nombreArchivo) {

}

function dibujarMesCalendarioPDF(doc, year, month, diasResaltadosSet, startY) {
  const primerDia = new Date(year, month, 1);
  const diasEnMes = new Date(year, month+1, 0).getDate();
  const offset = primerDia.getDay();
  const celdas = [];
  for (let i=0;i<offset;i++) celdas.push(null);
  for (let d=1; d<=diasEnMes; d++) celdas.push(d);
  while (celdas.length % 7 !== 0) celdas.push(null);
  const filas = [];
  for (let i=0;i<celdas.length;i+=7) filas.push(celdas.slice(i,i+7));

  const nombreMes = primerDia.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
  doc.setFontSize(9);
  doc.setFont(undefined, 'bold');
  doc.setTextColor(0);
  doc.text(nombreMes.charAt(0).toUpperCase()+nombreMes.slice(1), 14, startY);
  startY += 5;

  const body = filas.map(fila => fila.map(d => d===null ? '' : String(d)));
  doc.autoTable({
    startY,
    margin: { left: 14 },
    head: [['D','L','M','X','J','V','S']],
    body,
    theme: 'grid',
    styles: { fontSize: 8, cellPadding: 2.5, halign: 'center', lineColor: [255,255,255], lineWidth: 0.4 },
    headStyles: { fillColor: [30,30,33], textColor: 255, fontSize: 7 },
    tableWidth: 140,
    didParseCell: (data) => {
      if (data.section !== 'body') return;
      const val = data.cell.raw;
      if (val === '') { data.cell.styles.fillColor = [255,255,255]; return; }
      const fechaCelda = new Date(year, month, parseInt(val)).toDateString();
      if (diasResaltadosSet.has(fechaCelda)) {
        data.cell.styles.fillColor = [227,28,34];
        data.cell.styles.textColor = 255;
        data.cell.styles.fontStyle = 'bold';
      } else {
        data.cell.styles.fillColor = [245,245,246];
        data.cell.styles.textColor = [140,140,140];
      }
    }
  });
  return doc.lastAutoTable.finalY;
}

async function exportarGanttProyectoPDF(proyectoId) {
  await loadEmpleados(); await loadEquipos();
  const p = STATE.proyectos.find(x=>x.id===proyectoId);
  if (!p) { toast('No se encontró el proyecto','error'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
  let y = 18;

  doc.setFontSize(9);
  doc.setTextColor(150);
  doc.text('WORKSYNC', 14, y);
  y += 9;
  doc.setTextColor(0);
  doc.setFontSize(17);
  doc.setFont(undefined, 'bold');
  doc.text(p.nombre, 14, y);
  y += 7;
  doc.setFontSize(10);
  doc.setFont(undefined, 'normal');
  doc.setTextColor(90);
  doc.text(`${p.cliente||'—'}  ·  ${p.ciudad||'—'}`, 14, y);
  doc.setTextColor(0);
  y += 12;

  // Calendario visual del rango del proyecto (estimado)
  const inicio = fechaLocal(p.fecha_inicio);
  const fin = fechaLocal(p.fecha_fin_estimada);
  const duracionDias = Math.max(1, Math.round((fin - inicio) / 86400000) + 1);
  const diasProyecto = Array.from({length: duracionDias}, (_,i) => { const d = new Date(inicio); d.setDate(d.getDate()+i); return d; });

  doc.setFontSize(9);
  doc.setFont(undefined, 'bold');
  doc.text('CALENDARIO ESTIMADO', 14, y);
  y += 6;

  const diasProyectoSet = new Set(diasProyecto.map(d => d.toDateString()));
  const meses = [];
  let cursorMes = new Date(inicio.getFullYear(), inicio.getMonth(), 1);
  const ultimoMes = new Date(fin.getFullYear(), fin.getMonth(), 1);
  while (cursorMes <= ultimoMes && meses.length < 8) {
    meses.push({ year: cursorMes.getFullYear(), month: cursorMes.getMonth() });
    cursorMes = new Date(cursorMes.getFullYear(), cursorMes.getMonth()+1, 1);
  }

  meses.forEach((m, idx) => {
    if (y > 220) { doc.addPage(); y = 18; }
    y = dibujarMesCalendarioPDF(doc, m.year, m.month, diasProyectoSet, y);
    y += idx < meses.length-1 ? 8 : 0;
  });
  y += 8;

  doc.setFontSize(8.5);
  doc.setTextColor(0);
  doc.text(`Duración estimada: ${duracionDias} día(s)`, 14, y);
  if (p.fecha_inicio_real || p.fecha_fin_real) {
    y += 5;
    doc.text(`Fechas reales: ${p.fecha_inicio_real||'—'} al ${p.fecha_fin_real||'en curso'}`, 14, y);
  }
  y += 10;

  // Detalles del proyecto (solo lo relevante para el cliente)
  doc.setFontSize(9);
  doc.setFont(undefined, 'bold');
  doc.text('DETALLES DEL PROYECTO', 14, y);
  y += 6;
  doc.setFont(undefined, 'normal');
  doc.setFontSize(9);
  const detalles = [
    ['Personal requerido', `${(p.tecnicos_asignados||[]).length} / ${p.personal_requerido||1}`],
    ['Equipo requerido', p.no_requiere_equipo ? 'Sin equipo requerido' : 'Sí'],
  ];
  detalles.forEach(([etiqueta, valor]) => {
    doc.setTextColor(120); doc.text(etiqueta, 14, y);
    doc.setTextColor(0); doc.text(String(valor), 70, y);
    y += 5.5;
  });
  y += 4;

  // Personal asignado
  const personal = (p.tecnicos_asignados||[]).map(id => STATE.empleados.find(e=>e.id===id)).filter(Boolean);
  doc.setFontSize(9);
  doc.setFont(undefined, 'bold');
  doc.text('PERSONAL ASIGNADO', 14, y);
  y += 6;
  doc.setFont(undefined, 'normal');
  if (personal.length) {
    personal.forEach(e => {
      doc.text(`•  ${e.nombre} ${e.apellido}`, 16, y);
      y += 5.5;
    });
  } else {
    doc.setTextColor(150); doc.text('Sin personal asignado todavía.', 16, y); doc.setTextColor(0); y += 5.5;
  }
  y += 4;

  // Equipo asignado
  const equipoAsignado = (p.equipo_asignado_ids||[]).map(id => STATE.equipos.find(x=>x.id===id)).filter(Boolean);
  if (!p.no_requiere_equipo) {
    doc.setFontSize(9);
    doc.setFont(undefined, 'bold');
    doc.text('EQUIPO ASIGNADO', 14, y);
    y += 6;
    doc.setFont(undefined, 'normal');
    if (equipoAsignado.length) {
      equipoAsignado.forEach(eq => {
        doc.text(`•  ${eq.nombre}${eq.apodo?' ("'+eq.apodo+'")':''} — N/S ${eq.numero_serie||'—'}`, 16, y);
        y += 5.5;
      });
    } else {
      doc.setTextColor(150); doc.text('Sin equipo asignado todavía.', 16, y); doc.setTextColor(0); y += 5.5;
    }
  }

  doc.setFontSize(7.5);
  doc.setTextColor(150);
  doc.text(`Generado el ${new Date().toLocaleString('es-MX')}`, 14, 280);

  doc.save(`Gantt - ${p.nombre.replace(/[\\/:*?"<>|]/g,'-')} - ${new Date().toISOString().split('T')[0]}.pdf`);
}

async function ejecutarEvaluacion() {
  const pid = document.getElementById('ev-proyecto')?.value;
  if (!pid) { toast('Selecciona un proyecto primero','error'); return; }
  const resultsEl = document.getElementById('ev-results');
  resultsEl.innerHTML = '<div class="empty-state"><i class="ti ti-loader-2" aria-hidden="true"></i><p>Ejecutando motor de asignación...</p></div>';

  const r = await api('GET', `/proyectos/proyectos/${pid}/evaluar`);
  if (!r) { resultsEl.innerHTML = '<div class="empty-state"><i class="ti ti-alert-triangle" aria-hidden="true"></i><p>Error al ejecutar la evaluación.</p></div>'; return; }
  const dispEquipo = await api('GET', `/proyectos/proyectos/${pid}/disponibilidad-equipo`);
  const dispVeh = await api('GET', `/proyectos/proyectos/${pid}/disponibilidad-vehiculo`);

  const { proyecto_nombre, aprobados, descartados, mensaje_si_vacio } = r;
  const labels = { habilidades:'Habilidades', fatiga:'Fatiga', recencia:'Recencia', seniority:'Seniority', cercania:'Cercanía' };
  const amarillos = descartados.filter(d=>d.nivel==='amarillo');
  const rojos = descartados.filter(d=>d.nivel!=='amarillo');

  let html_out = '';
  const eqLabels = { drone:'Drone / RPAS', camara:'Cámara', termografo:'Termógrafo', escalada:'Equipo de escalada', medicion:'Medición', otro:'Otro' };
  if (dispEquipo && dispEquipo.no_requiere_equipo) {
    html_out += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text3)">
      <i class="ti ti-tool" aria-hidden="true"></i> Este proyecto no requiere equipo.
    </div>`;
  } else if (dispEquipo && dispEquipo.todo_disponible) {
    html_out += `<div style="background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--green)">
      <i class="ti ti-circle-check" aria-hidden="true"></i> <strong>Equipo disponible</strong> para las fechas de este proyecto.
    </div>`;
  } else if (dispEquipo && !dispEquipo.todo_disponible) {
    const faltantes = dispEquipo.items.filter(it=>!it.suficiente).map(it=>`${eqLabels[it.tipo]||it.tipo} (${it.disponibles}/${it.cantidad_requerida})`).join(', ');
    html_out += `<div style="background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--amber)">
      <i class="ti ti-alert-triangle" aria-hidden="true"></i> <strong>Aunque el personal califique, falta equipo disponible para estas fechas:</strong> ${faltantes}. No bloquea la asignación, pero revísalo antes de confirmar.
    </div>`;
  }
  // Vehículo: solo se muestra si el proyecto realmente requiere uno (la mayoría no)
  if (dispVeh && !dispVeh.no_requiere_vehiculo) {
    if (dispVeh.todo_disponible) {
      html_out += `<div style="background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--green)">
        <i class="ti ti-circle-check" aria-hidden="true"></i> <strong>Vehículo disponible</strong> para las fechas de este proyecto.
      </div>`;
    } else {
      const faltantesVeh = dispVeh.items.filter(it=>!it.suficiente).map(it=>`${VEH_TIPOS[it.tipo]||it.tipo} (${it.disponibles}/${it.cantidad_requerida})`).join(', ');
      html_out += `<div style="background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--amber)">
        <i class="ti ti-alert-triangle" aria-hidden="true"></i> <strong>Falta vehículo disponible para estas fechas:</strong> ${faltantesVeh}. No bloquea la asignación, pero revísalo antes de confirmar.
      </div>`;
    }
  }

  html_out += `<div style="background:var(--surface);border:1px solid var(--border);padding:10px 14px;border-radius:var(--radius);margin-bottom:14px;font-size:12px">
    <strong style="color:var(--text)">Evaluación — ${proyecto_nombre}</strong>
    <span style="color:var(--green);margin-left:12px">● ${aprobados.length} aprobados</span>
    <span style="color:var(--amber);margin-left:8px">● ${amarillos.length} podrían aprobarse</span>
    <span style="color:var(--red-text);margin-left:8px">● ${rojos.length} descartados</span>
  </div>`;

  if (aprobados.length) {
    html_out += `<div class="eval-section-title">CANDIDATOS APROBADOS</div>`;
    aprobados.forEach((c)=>{
      const top = c.posicion===1;
      const topClass = top?'candidato-card top':'candidato-card';
      html_out += `<div class="${topClass}">
        <div class="candidato-head">
          <div><div class="candidato-name">${top?'<span style="color:var(--green);margin-right:6px">①</span>':''}${c.nombre}</div><div class="candidato-sub">${c.recomendacion}${c.alerta_fatiga?' · ⚠️ fatiga alta':''}</div></div>
          <div style="text-align:right"><div class="candidato-score">${c.puntaje_total}<span class="score-max">/100</span></div></div>
        </div>
        ${['habilidades','fatiga','recencia','seniority','cercania'].map(key=>{
          const d = c.desglose[key];
          return `<div class="criterio-row" title="${d.justificacion||''}"><span class="criterio-name">${labels[key]}</span><div class="criterio-bar-wrap"><div class="criterio-bar-fill" style="width:${d.porcentaje}%"></div></div><span class="criterio-val">${d.puntos}/${d.maximo}</span></div>`;
        }).join('')}
        <div style="display:flex;justify-content:flex-end;margin-top:10px;gap:8px">
          <span style="display:inline-flex;align-items:center;padding:3px 10px;border-radius:2px;font-size:11px;font-weight:700;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)">${c.recomendacion}</span>
          <button class="btn btn-primary btn-sm" onclick="ejecutarConCarga(this, () => asignarTecnico('${c.id_empleado}','${pid}'))"><i class="ti ti-user-plus" aria-hidden="true"></i> Asignar</button>
        </div>
      </div>`;
    });
  }

  if (amarillos.length) {
    html_out += `<div class="eval-section-title" style="margin-top:14px;border-left-color:var(--amber)">PODRÍAN APROBARSE — les falta una sola cosa</div>`;
    amarillos.forEach(d=>{
      html_out += `<div style="background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:600;color:var(--text)">${d.nombre}</span>
          <span style="font-size:11px;color:var(--text3)">${d.filtro_falla}</span>
        </div>
        <div class="brecha-item">${d.razon}</div>
      </div>`;
    });
  }

  if (rojos.length) {
    html_out += `<div class="eval-section-title" style="margin-top:14px;border-left-color:var(--red-text)">DESCARTADOS — varios pendientes a la vez</div>`;
    rojos.forEach(d=>{
      html_out += `<div style="background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px">
        <div style="font-weight:600;color:var(--text);margin-bottom:6px">${d.nombre}</div>
        ${(d.filtros_fallidos||[{filtro:d.filtro_falla,razon:d.razon}]).map(f=>
          `<div class="brecha-item-rojo"><span style="color:var(--red-text-light);font-size:11px">${f.filtro}:</span> ${f.razon}</div>`
        ).join('')}
      </div>`;
    });
  }

  if (mensaje_si_vacio) {
    html_out += `<div class="empty-state"><i class="ti ti-alert-circle" aria-hidden="true"></i><p>${mensaje_si_vacio}</p></div>`;
  }

  resultsEl.innerHTML = html_out;
}

// Parsea "YYYY-MM-DD" como medianoche LOCAL, no UTC — evita que fechas de
// proyecto se "recorran" un día hacia atrás en zonas horarias negativas
// (México es UTC-6), que es lo que pasaba al usar new Date("2026-09-23")
// directo y compararla contra fechas construidas localmente (como el Gantt).
function fechaLocal(str) {
  if (!str) return null;
  return new Date(str + 'T00:00:00');
}

// Parsea el formato que da Google Maps al copiar un punto: "21.911..., -102.297..."
// Acepta espacios de más, y rechaza cualquier cosa que no sean dos números válidos.
function parsearCoordenadas(texto) {
  if (!texto) return null;
  const partes = texto.split(',').map(p => p.trim());
  if (partes.length !== 2) return null;
  const lat = parseFloat(partes[0]);
  const lon = parseFloat(partes[1]);
  if (isNaN(lat) || isNaN(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return { lat, lon };
}

    btn.disabled = marcados.length === 0;
    btn.innerHTML = `<i class="ti ti-download" aria-hidden="true"></i> Descargar seleccionados (${marcados.length})`;
  }
  const todos = document.querySelectorAll('.doc-check');
  const masterCb = document.getElementById('doc-check-all');

}

async function descargarDocumentosSeleccionados() {
  const marcados = Array.from(document.querySelectorAll('.doc-check:checked'));
  if (marcados.length === 0) return;
  const msg = document.getElementById('doc-descarga-msg');
  if (msg) msg.textContent = `Descargando ${marcados.length} archivo(s)...`;

  const emp = STATE._docEmpleadoActual || {};
  const nombrePersonal = `${emp.nombre||''} ${emp.apellido||''}`.trim() || 'Empleado';
  const fecha = new Date().toISOString().split('T')[0];
  const carpeta = `${nombrePersonal}/Documentos`;

  const zip = new JSZip();
  const usados = {};
  let fallidos = 0;
  for (const cb of marcados) {
    const url = cb.dataset.url;
    let nombre = cb.dataset.nombre || 'documento';
    const ext = (url.split('.').pop() || 'pdf').split('?')[0];
    if (!nombre.toLowerCase().endsWith('.'+ext.toLowerCase())) nombre += '.' + ext;
    usados[nombre] = (usados[nombre]||0) + 1;
    if (usados[nombre] > 1) nombre = nombre.replace(/(\.[^.]+)$/, ` (${usados[nombre]})$1`);
    try {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('fetch failed');
      const blob = await resp.blob();
      zip.file(`${carpeta}/${nombre}`, blob);
    } catch (err) {
      fallidos++;
    }
  }

  if (Object.keys(zip.files).length === 0) {
    if (msg) msg.textContent = 'No se pudo descargar ningún archivo.';
    return;
  }

  const contenido = await zip.generateAsync({ type: 'blob' });
  const enlace = document.createElement('a');
  enlace.href = URL.createObjectURL(contenido);
  enlace.download = `${nombrePersonal} - Documentos - ${fecha}.zip`;
  document.body.appendChild(enlace);
  enlace.click();
  document.body.removeChild(enlace);

  if (msg) msg.textContent = fallidos ? `Listo — ${fallidos} archivo(s) no se pudieron incluir.` : 'Descarga lista.';
}

async function guardarNuevoEquipo() {
  const nombre = document.getElementById('ne-nombre')?.value.trim();
  const tipo   = document.getElementById('ne-tipo')?.value;
  const serie  = document.getElementById('ne-serie')?.value.trim();
  const apodo  = document.getElementById('ne-apodo')?.value.trim();
  const ciudad = document.getElementById('ne-ciudad')?.value.trim();
  const coordsParseadas = parsearCoordenadas(document.getElementById('ne-coords')?.value.trim());
  const cal    = document.getElementById('ne-cal')?.value || null;
  const notas  = document.getElementById('ne-notas')?.value.trim();
  if (!nombre) { toast('El nombre del equipo es obligatorio','error'); return; }
  const id_eq = `EQP-${Date.now().toString(36).toUpperCase()}`;
  const r = await api('POST', '/equipos', {
    id: id_eq, nombre, tipo, numero_serie: serie || null, apodo: apodo || null,
    estado: 'disponible', ciudad_actual: ciudad || null,
    latitud: coordsParseadas?coordsParseadas.lat:null, longitud: coordsParseadas?coordsParseadas.lon:null,
    proxima_calibracion: cal, notas
  });
  if (!r) { toast('Error al registrar el equipo','error'); return; }
  closePanel(null, true);
  toast(`Equipo "${nombre}" registrado`);

  renderEquipos();

// ─── SECCIÓN: VEHÍCULOS ───────────────────────────────────────────────────────
// Misma mecánica que Equipos: unidades físicas (con placas), ubicación, se apartan
// para proyectos, y cada una lleva sus documentos (seguro, tarjeta de circulación...).
const VEH_TIPOS  = { camioneta:'Camioneta', auto:'Auto', van:'Van', camion:'Camión', moto:'Moto', otro:'Otro' };
const VEH_ICONOS = { camioneta:'ti-truck', auto:'ti-car', van:'ti-bus', camion:'ti-truck-delivery', moto:'ti-motorbike', otro:'ti-car' };
const VEH_DOC_TIPOS = { tarjeta_circulacion:'Tarjeta de circulación', seguro:'Seguro', verificacion:'Verificación', tenencia:'Tenencia / refrendo', factura:'Factura', otro:'Otro' };

// Escapa texto tecleado por el usuario antes de meterlo en HTML
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function opcionesTipoVehiculo(seleccionado) {
  return Object.entries(VEH_TIPOS).map(([k,v]) => `<option value="${k}" ${k===seleccionado?'selected':''}>${v}</option>`).join('');
}

async function loadVehiculos(forzar) {
  const ahora = Date.now();
  if (!forzar && STATE._vehCargadosEn && (ahora - STATE._vehCargadosEn) < 8000) return;
  const d = await api('GET', '/vehiculos');
  if (d) { STATE.vehiculos = d; STATE._vehCargadosEn = ahora; }
}

// Vuelve a pedir UN vehículo (con sus documentos) y lo deja al día en STATE — sirve también para archivados
async function refrescarVehiculo(id) {
  const v = await api('GET', `/vehiculos/${id}`);
  if (!v) return null;
  STATE.vehiculos = STATE.vehiculos || [];
  const i = STATE.vehiculos.findIndex(x => x.id === id);
  if (i >= 0) STATE.vehiculos[i] = v; else STATE.vehiculos.push(v);
  STATE._alertasVehCargadasEn = 0;   // los documentos cambiaron: recalcular alertas
  return v;
}

// Vigencia de un documento: color y texto según su fecha de vencimiento
function estadoVigencia(fecha) {
  if (!fecha) return { clave:'sin', color:'var(--text3)', texto:'Sin vigencia' };
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const dias = Math.round((fechaLocal(fecha) - hoy) / 86400000);
  if (dias < 0)   return { clave:'vencido',   color:'var(--red-text)', texto:`${fecha} (vencido hace ${-dias} día${dias===-1?'':'s'})` };
  if (dias <= 30) return { clave:'porvencer', color:'var(--amber)',    texto:`${fecha} (${dias===0?'vence hoy':'vence en '+dias+' día'+(dias===1?'':'s')})` };
  return { clave:'ok', color:'var(--text)', texto: fecha };
}

// Resumen de documentos para la tarjeta del vehículo
function resumenDocsVehiculo(v) {
  const docs = v.documentos || [];
  if (!docs.length) return { texto:'Sin documentos', color:'var(--text3)' };
  const est = docs.map(d => estadoVigencia(d.fecha_vencimiento).clave);
  const venc = est.filter(x => x === 'vencido').length;
  const por  = est.filter(x => x === 'porvencer').length;
  if (venc) return { texto: `${venc} vencido${venc>1?'s':''}${por?` · ${por} por vencer`:''}`, color:'var(--red-text)' };
  if (por)  return { texto: `${por} por vencer`, color:'var(--amber)' };
  return { texto: `${docs.length} al corriente`, color:'var(--green)' };
}

async function renderVehiculos() {
  const verArch = STATE._verArchivadosVeh || false;
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-ghost btn-sm" onclick="toggleVerArchivadosVeh()">${verArch?'<i class="ti ti-eye-off" aria-hidden="true"></i> Ocultar archivados':'<i class="ti ti-archive" aria-hidden="true"></i> Ver archivados'}</button><button class="btn btn-ghost btn-sm" onclick="loadVehiculos(true).then(renderVehiculos)"><i class="ti ti-refresh" aria-hidden="true"></i></button><button class="btn btn-primary btn-sm" onclick="openNuevoVehiculo()"><i class="ti ti-plus" aria-hidden="true"></i> Nuevo vehículo</button>`;
  if (verArch) {
    const d = await api('GET', '/vehiculos?solo_activos=false');
    if (d) STATE.vehiculos = d;
  } else {
    await loadVehiculos();
  }
  const vehiculos = STATE.vehiculos || [];
  const disp = vehiculos.filter(v => v.estado === 'disponible').length;
  const mant = vehiculos.filter(v => v.estado === 'mantenimiento').length;
  const ahora = Date.now();
  if (!STATE._alertasVehCargadasEn || (ahora - STATE._alertasVehCargadasEn) > 8000) {
    STATE._alertasVeh = await api('GET', '/vehiculos/alertas/documentos-por-vencer') || [];
    STATE._alertasVehCargadasEn = ahora;
  }
  const alertas = STATE._alertasVeh || [];
  const vencidos = alertas.filter(a => a.vencido).length;
  const porVencer = alertas.length - vencidos;
  html(`
    ${alertas.length ? `<div style="background:${vencidos?'var(--red-bg)':'var(--amber-bg)'};border:1px solid ${vencidos?'var(--red-border)':'var(--amber-border)'};border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;font-size:12px;color:${vencidos?'var(--red-text)':'var(--amber)'};cursor:pointer;display:flex;align-items:center;gap:8px" onclick="verAlertasVehiculos()">
      <i class="ti ti-alert-triangle" aria-hidden="true"></i>
      <strong>${vencidos ? `${vencidos} documento(s) vencido(s)` : ''}${vencidos && porVencer ? ' y ' : ''}${porVencer ? `${porVencer} por vencer en los próximos 30 días` : ''}</strong>
      <span style="margin-left:auto;color:var(--text3)">Ver detalle →</span>
    </div>` : ''}
    <div class="stats-grid">
      <div class="stat-card c-red"><div class="stat-lbl">TOTAL VEHÍCULOS</div><div class="stat-val">${vehiculos.length}</div><div class="stat-sub">en la flota</div></div>
      <div class="stat-card c-green"><div class="stat-lbl">DISPONIBLES</div><div class="stat-val">${disp}</div><div class="stat-sub">listos para uso</div></div>
      <div class="stat-card c-amber"><div class="stat-lbl">EN MANTENIMIENTO</div><div class="stat-val">${mant}</div><div class="stat-sub">fuera de servicio</div></div>
      <div class="stat-card"><div class="stat-lbl">EN USO</div><div class="stat-val">${vehiculos.filter(v => v.proyecto_actual_nombre).length}</div><div class="stat-sub">en un proyecto</div></div>
    </div>
    <div class="equipo-grid">
      ${vehiculos.length ? vehiculos.map(v => {
        const estadoMostrar = v.proyecto_actual_nombre ? 'en_proyecto' : (v.estado==='mantenimiento' ? 'mantenimiento' : v.estado==='baja' ? 'baja' : 'oficina');
        const docs = resumenDocsVehiculo(v);
        return `<div class="equipo-card" onclick="verVehiculo('${v.id}')">
        <div class="eq-head">
          <div class="eq-icon"><i class="ti ${VEH_ICONOS[v.tipo]||'ti-car'}" aria-hidden="true"></i></div>
          ${badge(estadoMostrar)}
        </div>
        <div class="eq-name">${escHtml(v.nombre)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="eq-type">${escHtml((VEH_TIPOS[v.tipo]||v.tipo||'').toUpperCase())}</div>
          ${v.apodo ? `<div style="font-size:12px;font-weight:600;color:var(--text2);font-style:italic">${escHtml(v.apodo)}</div>` : ''}
        </div>
        <div class="eq-row"><span>Placas</span><strong>${escHtml(v.placas||'—')}</strong></div>
        <div class="eq-row"><span>Ubicación</span><strong>${escHtml(v.proyecto_actual_ciudad || v.ciudad_actual || '—')}</strong></div>
        ${v.proyecto_actual_nombre ? `<div class="eq-row"><span>En proyecto</span><strong>${escHtml(v.proyecto_actual_nombre)}</strong></div>` : ''}
        <div class="eq-row"><span>Documentos</span><strong style="color:${docs.color}">${docs.texto}</strong></div>
      </div>`;
      }).join('') : '<div class="empty-state" style="grid-column:1/-1"><i class="ti ti-truck" aria-hidden="true"></i><p>Aún no hay vehículos registrados</p></div>'}
    </div>`);
}

function toggleVerArchivadosVeh() {
  STATE._verArchivadosVeh = !STATE._verArchivadosVeh;
  renderVehiculos();
}

async function guardarNuevoVehiculo() {
  const val = id => document.getElementById(id)?.value.trim();
  const nombre = val('nv-nombre');
  if (!nombre) { toast('El nombre del vehículo es obligatorio','error'); return; }
  const anioTxt = val('nv-anio');
  const anio = anioTxt ? Number(anioTxt) : null;
  if (anioTxt && (!Number.isInteger(anio) || anio < 1900 || anio > 2100)) { toast('El año debe ser un número entero entre 1900 y 2100','error'); return; }
  const coordsParseadas = parsearCoordenadas(val('nv-coords'));
  const id_veh = `VEH-${Date.now().toString(36).toUpperCase()}`;
  const r = await api('POST', '/vehiculos', {
    id: id_veh, nombre, tipo: document.getElementById('nv-tipo')?.value,
    placas: val('nv-placas') || null, marca: val('nv-marca') || null, modelo: val('nv-modelo') || null,
    anio, numero_serie: val('nv-serie') || null, apodo: val('nv-apodo') || null,
    estado: 'disponible', ciudad_actual: val('nv-ciudad') || null,
    latitud: coordsParseadas ? coordsParseadas.lat : null, longitud: coordsParseadas ? coordsParseadas.lon : null,
    notas: val('nv-notas') || ''
  });
  if (!r) { toast('Error al registrar el vehículo','error'); return; }
  closePanel(null, true);
  toast(`Vehículo "${nombre}" registrado`);
  await loadVehiculos(true);
  renderVehiculos();
  verVehiculo(id_veh);    // se abre de una vez para poder cargarle sus documentos
}

// Lista de documentos de un vehículo (se re-dibuja sola al agregar/quitar, sin perder lo que estés editando)
function renderDocsVehiculo(v) {

  if (!docs.length) return '<div style="font-size:12px;color:var(--text3);margin-bottom:8px">Sin documentos todavía.</div>';
  return docs.map(d => {
    const vg = estadoVigencia(d.fecha_vencimiento);
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="min-width:0">
        <div style="color:var(--text);font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis">${escHtml(d.nombre)}</div>
        <div style="font-size:11px;color:var(--text3)">${VEH_DOC_TIPOS[d.tipo]||escHtml(d.tipo)} · <span style="color:${vg.color}">${d.fecha_vencimiento ? 'Vence: '+vg.texto : 'Sin vigencia'}</span></div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        ${d.ruta_archivo ? `<button class="btn btn-ghost btn-sm" onclick="verDocumentoVehiculo('${v.id}',${d.id})"><i class="ti ti-eye" aria-hidden="true"></i> Ver</button>` : '<span style="font-size:11px;color:var(--text3);align-self:center">sin archivo</span>'}
        <button class="btn btn-ghost btn-sm" style="color:var(--red-text)" onclick="eliminarDocumentoVehiculo('${v.id}',${d.id})" title="Quitar documento"><i class="ti ti-trash" aria-hidden="true"></i></button>

    </div>`;
  }).join('');
}

async function guardarEdicionVehiculo(id) {
  const val = i => document.getElementById(i)?.value.trim();
  const nombre = val('vv-nombre');
  if (!nombre) { toast('El nombre del vehículo es obligatorio','error'); return; }
  const anioTxt = val('vv-anio');
  const anio = anioTxt ? Number(anioTxt) : null;
  if (anioTxt && (!Number.isInteger(anio) || anio < 1900 || anio > 2100)) { toast('El año debe ser un número entero entre 1900 y 2100','error'); return; }
  const coordsParseadas = parsearCoordenadas(val('vv-coords'));
  const datos = {
    nombre, tipo: document.getElementById('vv-tipo')?.value, estado: document.getElementById('vv-estado')?.value,
    placas: val('vv-placas') || null, apodo: val('vv-apodo') || null, marca: val('vv-marca') || null,
    modelo: val('vv-modelo') || null, anio, numero_serie: val('vv-serie') || null,
    ciudad_actual: val('vv-ciudad') || null, notas: val('vv-notas') || ''
  };
  if (coordsParseadas) { datos.latitud = coordsParseadas.lat; datos.longitud = coordsParseadas.lon; }
  const r = await api('PUT', `/vehiculos/${id}`, datos);
  if (!r) { toast('Error al guardar los cambios','error'); return; }
  closePanel(null, true);
  toast('Vehículo actualizado');
  await loadVehiculos(true);
  renderVehiculos();
}

// Subida de documentos del vehículo. A diferencia de los documentos personales, aquí NO se guarda una copia local
// como respaldo si falla: preferimos avisar del error antes que dejar un documento sin archivo real.
async function subirArchivoVehiculo(file, nombre, carpeta) {
  try {
    const fd = new FormData();
    fd.append('file', file);
    const url = `${API}/storage/upload?empleado_id=${encodeURIComponent(carpeta)}&nombre_doc=${encodeURIComponent(nombre)}`;
    const r = await fetch(url, { method: 'POST', headers: { 'Authorization': `Bearer ${STATE.token}` }, body: fd });
    if (!r.ok) { console.error('Upload error:', r.status, await r.text()); return null; }
    const d = await r.json();
    return d.url || null;
  } catch (e) {
    console.error('Upload exception:', e);
    return null;
  }
}

async function agregarDocumentoVehiculo(vehId) {
  const tipo   = document.getElementById('vd-tipo')?.value || 'otro';
  const nombreIn = document.getElementById('vd-nombre')?.value.trim();
  const vence  = document.getElementById('vd-vence')?.value || null;
  const file   = document.getElementById('vd-archivo')?.files?.[0];
  if (!file && !vence) { toast('Adjunta el archivo o captura una fecha de vencimiento','error'); return; }
  const nombre = nombreIn || VEH_DOC_TIPOS[tipo] || 'Documento';
  let ruta = null;
  if (file) {
    ruta = await subirArchivoVehiculo(file, `${tipo}-${Date.now()}`, `vehiculos/${vehId}`);
    if (!ruta) { toast('No se pudo subir el archivo. Revisa tu conexión e intenta de nuevo.','error'); return; }
  }
  const r = await api('POST', `/vehiculos/${vehId}/documentos`, { tipo, nombre, fecha_vencimiento: vence, ruta_archivo: ruta });
  if (!r) { toast('Error al guardar el documento','error'); return; }
  const v = await refrescarVehiculo(vehId);
  const lista = document.getElementById('vv-docs-list');
  if (v && lista) lista.innerHTML = renderDocsVehiculo(v);
  ['vd-nombre','vd-vence','vd-archivo'].forEach(i => { const el = document.getElementById(i); if (el) el.value = ''; });
  toast('Documento agregado');
}

async function eliminarDocumentoVehiculo(vehId, docId) {
  if (!confirm('¿Quitar este documento? Se borra del vehículo (el archivo subido no se elimina del almacenamiento).')) return;
  const r = await api('DELETE', `/vehiculos/${vehId}/documentos/${docId}`);
  if (!r) { toast('Error al quitar el documento','error'); return; }
  const v = await refrescarVehiculo(vehId);
  const lista = document.getElementById('vv-docs-list');
  if (v && lista) lista.innerHTML = renderDocsVehiculo(v);
  toast('Documento eliminado');
}

function verDocumentoVehiculo(vehId, docId) {
  const v = (STATE.vehiculos||[]).find(x => x.id === vehId);
  const d = v && (v.documentos||[]).find(x => x.id === docId);
  if (d && d.ruta_archivo) abrirVisor(d.ruta_archivo, d.nombre);
}

// ─── Vehículos dentro de un proyecto (misma mecánica que equipo) ──────────────
function tarjetaVehiculoProyecto(p, asignados) {
  const idsAsignados = (p.vehiculo_asignado_ids || []).length;
  const totalRequerido = (p.vehiculo_requerido_resumen || []).reduce((s, v) => s + v.cantidad, 0);
  // Si el proyecto no usa vehículos no se muestra la tarjeta (evita ruido en los proyectos que nunca los necesitan)
  if (p.no_requiere_vehiculo && !totalRequerido && !idsAsignados) return '';
  const ok = totalRequerido === 0 || idsAsignados >= totalRequerido;
  const detalle = totalRequerido === 0 ? `${idsAsignados} unidad(es) apartada(s)` : `${idsAsignados}/${totalRequerido} unidad(es) apartada(s)`;
  return `<div style="flex:1;min-width:140px;background:${ok?'var(--green-bg)':'var(--amber-bg)'};border:1px solid ${ok?'var(--green-border)':'var(--amber-border)'};border-radius:var(--radius);padding:10px 14px">
        <div style="font-size:10px;color:${ok?'var(--green)':'var(--amber)'};font-weight:700">VEHÍCULO ${ok?'✓ COMPLETO':'⚠ INCOMPLETO'}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${detalle}</div>
      </div>`;
}

function seccionVehiculosProyecto(p, asignados, disp, editando) {
  const puedeEditar = STATE.rol !== 'tecnico';
  const items = p.vehiculo_requerido_items || [];
  const sinNada = p.no_requiere_vehiculo && !items.length && !asignados.length;
  let cuerpo;
  if (sinNada && !editando) {
    cuerpo = '<div style="font-size:12px;color:var(--text3)">Este proyecto no requiere vehículo.</div>';
  } else {
    cuerpo = `
      ${items.length ? items.map(it => {
        const info = disp ? (disp.items||[]).find(d => d.tipo === it.tipo) : null;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
          <span>${VEH_TIPOS[it.tipo]||escHtml(it.tipo)} — necesita ${it.cantidad}</span>
          <span style="display:flex;align-items:center;gap:10px">
            ${info ? `<span style="color:${info.suficiente?'var(--green)':'var(--amber)'}">${info.disponibles} disponible(s)</span>` : ''}
            ${editando && puedeEditar ? `<button class="btn btn-ghost btn-sm" style="padding:2px 6px" onclick="ejecutarConCarga(this, () => quitarRequisitoProyecto('${p.id}','vehiculo-requerido',${it.id}))"><i class="ti ti-x" aria-hidden="true"></i></button>` : ''}
          </span>
        </div>`;
      }).join('') : '<div style="font-size:12px;color:var(--text3);margin-bottom:10px">Sin vehículo requerido configurado.</div>'}
      ${editando && puedeEditar ? `<div style="display:flex;gap:8px;margin:8px 0 14px">
        <select class="field-select" id="pd-veh-tipo" style="flex:2">${opcionesTipoVehiculo('camioneta')}</select>
        <input class="field-input" id="pd-veh-cantidad" type="number" min="1" value="1" style="width:70px">
        <button class="btn btn-ghost btn-sm" onclick="ejecutarConCarga(this, () => agregarVehiculoRequeridoProyecto('${p.id}'))"><i class="ti ti-plus" aria-hidden="true"></i></button>
      </div>` : ''}
      ${disp && !disp.todo_disponible ? `
        <div style="background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);padding:10px 14px;margin:12px 0;font-size:12px;color:var(--amber)">
          <i class="ti ti-alert-triangle" aria-hidden="true"></i> <strong>Falta vehículo disponible para estas fechas</strong> — revisa si rentar o conseguir otro. Esto no bloquea el proyecto.
        </div>` : ''}
      <div style="font-size:11px;color:var(--text3);margin:14px 0 6px">UNIDADES YA APARTADAS PARA ESTE PROYECTO</div>
      ${asignados.length ? asignados.map(v => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
          <span>${escHtml(v.nombre)} <span style="color:var(--text3)">(${escHtml(v.placas||'sin placas')})</span></span>
          ${editando && puedeEditar ? `<button class="btn btn-ghost btn-sm" style="padding:2px 8px;color:var(--red-text)" onclick="ejecutarConCarga(this, () => liberarVehiculoDeProyecto('${p.id}','${v.id}'))"><i class="ti ti-x" aria-hidden="true"></i></button>` : ''}
        </div>`).join('') : '<div style="font-size:12px;color:var(--text3)">Ninguna todavía.</div>'}`;
  }
  const botones = puedeEditar ? `
      <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="abrirAsignacionVehiculo('${p.id}')"><i class="ti ti-truck" aria-hidden="true"></i> Asignar vehículo específico</button>
      <button class="btn btn-ghost btn-sm" style="margin-top:10px;margin-left:8px" onclick="toggleEditarRequisitos('${p.id}')"><i class="ti ${editando?'ti-eye-off':'ti-pencil'}" aria-hidden="true"></i> ${editando?'Ocultar edición':'Editar requisitos'}</button>` : '';
  return `<div class="panel-section">
      <div class="panel-section-title">VEHÍCULOS</div>
      ${cuerpo}${botones}
    </div>`;
}

async function agregarVehiculoRequeridoProyecto(proyectoId) {
  const tipo = document.getElementById('pd-veh-tipo')?.value;
  const cantidad = document.getElementById('pd-veh-cantidad')?.value || 1;
  const params = new URLSearchParams({ tipo, cantidad });
  const r = await api('POST', `/proyectos/proyectos/${proyectoId}/vehiculo-requerido?${params}`);
  if (!r) { toast('Error al agregar el requisito de vehículo','error'); return; }
  toast('Requisito de vehículo agregado');
  await loadProyectos(true);
  verProyecto(proyectoId);
}

async function abrirAsignacionVehiculo(proyectoId) {
  const lista = await api('GET', `/proyectos/proyectos/${proyectoId}/vehiculos-para-asignar`);
  const candidatos = (lista||[]).filter(v => !v.ya_asignado_aqui);
  openPanel('Asignar vehículo específico', `
    <div class="panel-section">
      <div class="field-row full"><div class="field-group"><label class="field-label">VEHÍCULO</label>
        <select class="field-select" id="asig-veh-select">
          ${candidatos.map(v => `<option value="${v.id}" data-disponible="${v.disponible}" data-conflicto="${escHtml(v.conflicto_con||'')}">${escHtml(v.nombre)} — ${escHtml(v.placas||'sin placas')} (${v.disponible ? 'disponible' : 'no disponible — en uso en "'+escHtml(v.conflicto_con)+'"'})</option>`).join('')}
        </select>
      </div></div>
      ${candidatos.length===0 ? '<div style="font-size:12px;color:var(--text3)">No hay más vehículos registrados para asignar.</div>' : ''}
    </div>`,
    `<button class="btn btn-ghost btn-sm" onclick="verProyecto('${proyectoId}')">Cancelar</button><button class="btn btn-primary btn-sm" onclick="ejecutarConCarga(this, () => confirmarAsignacionVehiculo('${proyectoId}'))"><i class="ti ti-check" aria-hidden="true"></i> Asignar</button>`);
}

async function confirmarAsignacionVehiculo(proyectoId) {
  const sel = document.getElementById('asig-veh-select');
  const vehId = sel?.value;
  if (!vehId) return;
  const opt = sel.selectedOptions[0];
  if (opt && opt.dataset.disponible === 'false') {
    if (!confirm(`Este vehículo ya está en uso en "${opt.dataset.conflicto}" durante fechas que se encimarían con este proyecto. ¿Asignarlo de todas formas?`)) return;
  }
  const r = await api('POST', `/proyectos/proyectos/${proyectoId}/asignar-vehiculo/${vehId}`);
  if (!r) { toast('Error al asignar el vehículo','error'); return; }
  toast(r.mensaje || 'Vehículo asignado');
  await loadProyectos(true);
  verProyecto(proyectoId);
}

function renderListaVehiculoProyecto() {
  const list = STATE._np_vehiculo || [];
  if (!list.length) return '<div style="font-size:12px;color:var(--text3)">Ninguno agregado.</div>';
  return list.map((v, i) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
    <span>${VEH_TIPOS[v.tipo]||escHtml(v.tipo)} — cantidad: ${v.cantidad}</span>
    <button class="btn btn-ghost btn-sm" onclick="quitarVehiculoProyecto(${i})" style="padding:2px 6px"><i class="ti ti-x" aria-hidden="true"></i></button>
  </div>`).join('');
}
function agregarVehiculoProyecto() {
  const tipo = document.getElementById('np-veh-tipo')?.value;
  const cantidad = parseInt(document.getElementById('np-veh-cantidad')?.value || '1', 10) || 1;
  if (!STATE._np_vehiculo) STATE._np_vehiculo = [];
  STATE._np_vehiculo = STATE._np_vehiculo.filter(v => v.tipo !== tipo);
  STATE._np_vehiculo.push({ tipo, cantidad });
  document.getElementById('np-vehiculo-list').innerHTML = renderListaVehiculoProyecto();
}
function quitarVehiculoProyecto(i) {
  STATE._np_vehiculo.splice(i, 1);
  document.getElementById('np-vehiculo-list').innerHTML = renderListaVehiculoProyecto();
}

            <option value="finalizados">Finalizados</option>
            <option value="todos">Todos</option>
            <option value="por_fecha">Por fecha</option>
          </select>
          <select id="mapa-periodo-proy" class="field-select" style="display:none;width:auto;height:32px;font-size:12px" onchange="actualizarMapa()">
            <option value="semana">Esta semana</option>
            <option value="mes" selected>Este mes</option>
            <option value="30d">Próximos 30 días</option>
            <option value="rango">Rango personalizado…</option>
          </select>
          <span id="mapa-rango-proy" style="display:none;align-items:center;gap:6px;font-size:11px;color:var(--text3)">
            <input type="date" id="mapa-desde" class="field-input" style="width:auto;height:32px;font-size:12px" onchange="actualizarMapa()"> a
            <input type="date" id="mapa-hasta" class="field-input" style="width:auto;height:32px;font-size:12px" onchange="actualizarMapa()">
          </span>
        </div>
        <span id="mapa-conteo" style="font-size:11px;color:var(--text3);margin-left:auto"></span>
      </div>
    </div>
    <div id="map-container" class="map-container"></div>`);
  setTimeout(inicializarMapa, 30);
}

function inicializarMapa() {
  const cont = document.getElementById('map-container');
  if (!cont || typeof L === 'undefined') return;
  if (MAPA_LEAFLET) { MAPA_LEAFLET.remove(); MAPA_LEAFLET = null; }
  MAPA_LEAFLET = L.map('map-container', { zoomControl: true }).setView([23.6345, -102.5528], 5);
  aplicarTileMapa();
  actualizarMapa();
}

function aplicarTileMapa() {
  if (!MAPA_LEAFLET) return;
  if (MAPA_TILE_LAYER) MAPA_LEAFLET.removeLayer(MAPA_TILE_LAYER);
  const esClaro = document.documentElement.getAttribute('data-theme') === 'light';
  const url = esClaro
    ? 'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}'
    : 'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}';
  MAPA_TILE_LAYER = L.tileLayer(url, {
    attribution: 'Tiles &copy; Esri',
    maxZoom: 16
  }).addTo(MAPA_LEAFLET);
}

// Rango de fechas del filtro del mapa según el periodo elegido. null = sin filtro de fecha.
function rangoMapaSeleccionado(periodo) {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  if (periodo === 'semana') {
    const desde = new Date(hoy); desde.setDate(hoy.getDate() - ((hoy.getDay()+6)%7));   // lunes
    const hasta = new Date(desde); hasta.setDate(desde.getDate()+6);
    return { desde, hasta };
  }
  if (periodo === 'mes') {
    return { desde: new Date(hoy.getFullYear(), hoy.getMonth(), 1), hasta: new Date(hoy.getFullYear(), hoy.getMonth()+1, 0) };
  }
  if (periodo === '30d') {
    const hasta = new Date(hoy); hasta.setDate(hoy.getDate()+30);
    return { desde: hoy, hasta };
  }
  if (periodo === 'rango') {
    const d = document.getElementById('mapa-desde')?.value;
    const h = document.getElementById('mapa-hasta')?.value;
    return { desde: d ? fechaLocal(d) : null, hasta: h ? fechaLocal(h) : null };
  }
  return null;
}

// Vista: activos (en curso + programados) | en_curso | programados | finalizados | todos
//        | por_fecha (sin restricción de estado; solo aplica el periodo elegido)
function proyectoPasaFiltroMapa(p, vista, rango) {
  const terminado = p.estado === 'completado' || p.estado === 'cancelado';
  const iniciado = proyectoIniciado(p);
  const clase = terminado ? 'finalizados' : (iniciado ? 'en_curso' : 'programados');
  if (vista === 'activos' && clase === 'finalizados') return false;
  if (['en_curso','programados','finalizados'].includes(vista) && vista !== clase) return false;
  if (rango && (rango.desde || rango.hasta)) {
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const ini = fechaLocal(p.fecha_inicio_real || p.fecha_inicio);
    let fin = fechaLocal(p.fecha_fin_real || p.fecha_fin_estimada || p.fecha_inicio);
    if (iniciado && hoy > fin) fin = hoy;   // sigue en campo aunque ya pasó su fecha estimada de fin
    if (rango.desde && fin < rango.desde) return false;
    if (rango.hasta && ini > rango.hasta) return false;
  }
  return true;
}

function actualizarMapa() {
  if (!MAPA_LEAFLET) return;
  MAPA_MARKERS.forEach(m => MAPA_LEAFLET.removeLayer(m));
  MAPA_MARKERS = [];

  const verProy = document.getElementById('mapa-f-proyectos')?.checked;
  const verPers = document.getElementById('mapa-f-personal')?.checked;
  const verEq   = document.getElementById('mapa-f-equipo')?.checked;
  const verVeh  = document.getElementById('mapa-f-vehiculos')?.checked;
  const busqueda = (document.getElementById('mapa-buscar')?.value || '').toLowerCase().trim();
  let n = 0;

  const inputBuscar = document.getElementById('mapa-buscar');
  if (inputBuscar) {
    const activos = [verProy&&'proyectos', verPers&&'personal', verEq&&'equipo', verVeh&&'vehículos'].filter(Boolean);
    inputBuscar.placeholder = activos.length === 1
      ? `Buscar en ${activos[0]}...`
      : 'Buscar...';
  }

  const coloresProyecto = { en_progreso:'#E31C22', asignado:'#22c55e', en_preparacion:'#f59e0b', pausado:'#f97316', cancelado:'#9ca3af', completado:'#3b82f6', pendiente_asignacion:'#6b7280' };
  const etiquetasEstadoPry = { en_progreso:'En progreso', asignado:'Asignado', en_preparacion:'En preparativos', pausado:'Pausado', cancelado:'Cancelado', completado:'Completado', pendiente_asignacion:'Pendiente de asignación' };

  // Los controles de vista solo se ven cuando "Proyectos" está activo.
  // El desplegable de periodo solo aparece (y solo se aplica) cuando la vista es "Por fecha";
  // las fechas desde/hasta, solo cuando además el periodo es "Rango personalizado…"
  const vistaPry = document.getElementById('mapa-vista-proy')?.value || 'activos';
  const porFecha = vistaPry === 'por_fecha';
  const periodoSelEl = document.getElementById('mapa-periodo-proy');
  const periodoPry = porFecha ? (periodoSelEl?.value || 'mes') : '';
  const filtrosProyEl = document.getElementById('mapa-filtros-proy');
  if (filtrosProyEl) filtrosProyEl.style.display = verProy ? 'flex' : 'none';
  if (periodoSelEl) periodoSelEl.style.display = (verProy && porFecha) ? '' : 'none';
  const rangoWrapEl = document.getElementById('mapa-rango-proy');
  if (rangoWrapEl) rangoWrapEl.style.display = (verProy && porFecha && periodoPry === 'rango') ? 'flex' : 'none';
  const rangoPry = rangoMapaSeleccionado(periodoPry);

  if (verProy) {
    STATE.proyectos.forEach(p => {
      if (!p.latitud || !p.longitud) return;
      if (!proyectoPasaFiltroMapa(p, vistaPry, rangoPry)) return;
      if (busqueda && !p.nombre.toLowerCase().includes(busqueda)) return;
      const estadoVis = estadoProyectoVisible(p);
      const color = coloresProyecto[estadoVis] || '#6b7280';
      const anillo = L.circleMarker([p.latitud, p.longitud], { radius: 8, className: 'marker-pulso', color: 'transparent', weight: 0, fillColor: color, fillOpacity: .6, interactive: false }).addTo(MAPA_LEAFLET);
      MAPA_MARKERS.push(anillo);
      const m = L.circleMarker([p.latitud, p.longitud], { radius: 8, className: 'marker-suave', color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 0.9 })
        .bindPopup(`<strong>${p.nombre}</strong><br>${p.cliente||'—'}<br>${p.ciudad||'—'}<br><span style="color:${color}">●</span> ${etiquetasEstadoPry[estadoVis]||estadoVis}${textoRetrasoInicio(p)?`<br><span style="color:#f59e0b">${textoRetrasoInicio(p)}</span>`:''}<br>${p.fecha_inicio} al ${p.fecha_fin_estimada}<br><a href="#" onclick="verProyecto('${p.id}');return false;">Ver detalle →</a>`)
        .bindTooltip(p.nombre, { direction: 'top', className: 'mapa-tooltip', offset: [0,-6] })
        .addTo(MAPA_LEAFLET);
      MAPA_MARKERS.push(m); n++;
    });
  }
  if (verPers) {
    STATE.empleados.forEach(e => {
      if (e.estado_perfil !== 'activo') return;
      if (busqueda && !`${e.nombre} ${e.apellido}`.toLowerCase().includes(busqueda)) return;
      let lat = e.latitud, lon = e.longitud, enSitio = false, pryAsignado = null;
      // Su proyecto = el que ya está en campo o, si no, el más próximo (no el último que se le asignó)
      pryAsignado = proyectoVigenteDe(e.id);
      // Solo aparece en el sitio cuando ese proyecto ya se inició de verdad; antes se queda en su base
      if (pryAsignado && e.disponibilidad === 'en_proyecto' && proyectoIniciado(pryAsignado) && pryAsignado.latitud && pryAsignado.longitud) { lat = pryAsignado.latitud; lon = pryAsignado.longitud; enSitio = true; }
      const textoBase = (pryAsignado && !proyectoIniciado(pryAsignado)) ? `En base · asignado a ${pryAsignado.nombre} (inicia ${pryAsignado.fecha_inicio})` : 'En base';
      if (!lat || !lon) return;
      const coloresPersonal = { libre:'#22c55e', asignado:'#22c55e', en_preparacion:'#f59e0b', en_proyecto:'#E31C22' };
      const color = enSitio ? '#E31C22' : (coloresPersonal[estadoVisible(e)] || '#6b7280');
      const anillo = L.circleMarker([lat, lon], { radius: 6, className: 'marker-pulso', color: 'transparent', weight: 0, fillColor: color, fillOpacity: .6, interactive: false }).addTo(MAPA_LEAFLET);
      MAPA_MARKERS.push(anillo);
      const m = L.circleMarker([lat, lon], { radius: 6, className: 'marker-suave', color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 0.9 })
        .bindPopup(`<strong>${e.nombre} ${e.apellido}</strong><br>${enSitio?'En sitio: '+pryAsignado.nombre:textoBase+'<br>'+(e.ciudad||'—')}<br><a href="#" onclick="verEmpleado('${e.id}');return false;">Ver perfil →</a>`)
        .bindTooltip(`${e.nombre} — ${enSitio?'En proyecto: '+pryAsignado.nombre:textoBase}`, { direction: 'top', className: 'mapa-tooltip', offset: [0,-5] })
        .addTo(MAPA_LEAFLET);
      MAPA_MARKERS.push(m); n++;
    });
  }
  if (verEq) {
    STATE.equipos.forEach(eq => {
      if (busqueda && !`${eq.nombre} ${eq.apodo||''}`.toLowerCase().includes(busqueda)) return;
      let lat = eq.latitud, lon = eq.longitud, enSitio = false;
      if (eq.proyecto_actual_id) {
        const p = STATE.proyectos.find(x=>x.id===eq.proyecto_actual_id);
        if (p && proyectoIniciado(p) && p.latitud && p.longitud) { lat = p.latitud; lon = p.longitud; enSitio = true; }
      }
      if (!lat || !lon) return;
      const colorEq = enSitio?'#E31C22':'#a78bfa';
      const anillo = L.circleMarker([lat, lon], { radius: 5, className: 'marker-pulso', color: 'transparent', weight: 0, fillColor: colorEq, fillOpacity: .6, interactive: false }).addTo(MAPA_LEAFLET);
      MAPA_MARKERS.push(anillo);
      const m = L.circleMarker([lat, lon], { radius: 5, className: 'marker-suave', color: '#fff', weight: 1.5, fillColor: colorEq, fillOpacity: 0.9 })
        .bindPopup(`<strong>${eq.nombre}</strong>${eq.apodo?`<br><em>${eq.apodo}</em>`:''}<br>${enSitio?'En sitio: '+eq.proyecto_actual_nombre:(eq.ciudad_actual||'Sin ubicación asignada')}`)
        .bindTooltip(`${eq.nombre}${eq.apodo?' ('+eq.apodo+')':''} — ${enSitio?'En proyecto: '+eq.proyecto_actual_nombre:'En oficina'}`, { direction: 'top', className: 'mapa-tooltip', offset: [0,-4] })
        .addTo(MAPA_LEAFLET);
      MAPA_MARKERS.push(m); n++;
    });
  }
  if (verVeh) {
    (STATE.vehiculos||[]).forEach(v => {
      if (busqueda && !`${v.nombre} ${v.apodo||''} ${v.placas||''}`.toLowerCase().includes(busqueda)) return;
      let lat = v.latitud, lon = v.longitud, enSitio = false;
      if (v.proyecto_actual_id) {
        const p = STATE.proyectos.find(x=>x.id===v.proyecto_actual_id);
        // Solo aparece en el sitio cuando el proyecto ya se inició de verdad; antes se queda en su base
        if (p && proyectoIniciado(p) && p.latitud && p.longitud) { lat = p.latitud; lon = p.longitud; enSitio = true; }
      }
      if (!lat || !lon) return;
      const colorVeh = enSitio ? '#E31C22' : '#14b8a6';
      const anillo = L.circleMarker([lat, lon], { radius: 5, className: 'marker-pulso', color: 'transparent', weight: 0, fillColor: colorVeh, fillOpacity: .6, interactive: false }).addTo(MAPA_LEAFLET);
      MAPA_MARKERS.push(anillo);
      const m = L.circleMarker([lat, lon], { radius: 5, className: 'marker-suave', color: '#fff', weight: 1.5, fillColor: colorVeh, fillOpacity: 0.9 })
        .bindPopup(`<strong>${escHtml(v.nombre)}</strong>${v.apodo?`<br><em>${escHtml(v.apodo)}</em>`:''}${v.placas?`<br>${escHtml(v.placas)}`:''}<br>${enSitio?'En sitio: '+escHtml(v.proyecto_actual_nombre):escHtml(v.ciudad_actual||'Sin ubicación asignada')}<br><a href="#" onclick="verVehiculo('${v.id}');return false;">Ver vehículo →</a>`)
        .bindTooltip(`${v.nombre}${v.apodo?' ('+v.apodo+')':''} — ${enSitio?'En proyecto: '+v.proyecto_actual_nombre:'En oficina'}`, { direction: 'top', className: 'mapa-tooltip', offset: [0,-4] })
        .addTo(MAPA_LEAFLET);
      MAPA_MARKERS.push(m); n++;
    });
  }

  const conteo = document.getElementById('mapa-conteo');
  if (conteo) conteo.textContent = `${n} punto(s) en el mapa`;
}

      </div>

        <button class="btn btn-ghost btn-sm" onclick="aplicarRangoMetricas(30)">Últimos 30 días</button>
        <button class="btn btn-ghost btn-sm" onclick="aplicarRangoMetricas(90)">Últimos 90 días</button>
      </div>
      <div style="margin-top:14px;display:flex;justify-content:flex-end;gap:8px">

      </div>
    </div>
    <div id="metricas-resultado"></div>`);
}

function aplicarRangoMetricas(dias) {
  const hoy = new Date();
  const desde = new Date(hoy); desde.setDate(desde.getDate()-dias);
  document.getElementById('met-desde').value = desde.toISOString().split('T')[0];
  document.getElementById('met-hasta').value = hoy.toISOString().split('T')[0];
  document.getElementById('met-proyecto').value = '';
}

async function generarMetricas() {
  const proyectoId = document.getElementById('met-proyecto')?.value;
  const desde = document.getElementById('met-desde')?.value;
  const hasta = document.getElementById('met-hasta')?.value;
  let url = '/proyectos/proyectos/metricas';
  const params = [];
  if (proyectoId) params.push(`proyecto_id=${encodeURIComponent(proyectoId)}`);
  else {
    if (desde) params.push(`fecha_desde=${desde}`);
    if (hasta) params.push(`fecha_hasta=${hasta}`);
  }
  if (params.length) url += '?' + params.join('&');

  const datos = await api('GET', url);
  const cont = document.getElementById('metricas-resultado');
  if (!datos) { cont.innerHTML = '<div class="empty-state"><i class="ti ti-alert-circle" aria-hidden="true"></i><p>Error al generar el reporte</p></div>'; return; }
  STATE._ultimasMetricas = datos;

  if (datos.length === 0) {
    cont.innerHTML = '<div class="empty-state"><i class="ti ti-chart-bar" aria-hidden="true"></i><p>Sin proyectos finalizados en ese criterio</p><span>Las métricas solo aplican a proyectos ya finalizados</span></div>';
    return;
  }

  const retrasoTexto = r => r===null||r===undefined ? '—' : r>0 ? `+${r} día(s) de retraso` : r<0 ? `${Math.abs(r)} día(s) antes de lo estimado` : 'A tiempo';
  const retrasoColor = r => r===null||r===undefined ? 'var(--text3)' : r>0 ? 'var(--red-text)' : r<0 ? 'var(--green)' : 'var(--text2)';

  cont.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:12px;color:var(--text3)">${datos.length} proyecto(s) en el resultado</span>
      <button class="btn btn-primary btn-sm" onclick="exportarMetricasPDF()"><i class="ti ti-file-download" aria-hidden="true"></i> Exportar a PDF</button>
    </div>
    ${datos.map(p=>`<div class="table-section" style="margin-bottom:12px;padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div><div style="font-size:14px;font-weight:600;color:var(--text)">${p.nombre}</div><div style="font-size:12px;color:var(--text2)">${p.cliente||'—'} · ${p.ciudad||'—'}</div></div>
        <span style="font-weight:600;font-size:12px;color:${retrasoColor(p.retraso_dias)}">${retrasoTexto(p.retraso_dias)}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;font-size:12px;margin-bottom:10px">
        <div><span style="color:var(--text3)">Inicio estimado</span><div class="td-mono" style="color:var(--text)">${p.fecha_inicio_estimada||'—'}</div></div>
        <div><span style="color:var(--text3)">Inicio real</span><div class="td-mono" style="color:var(--text)">${p.fecha_inicio_real||'—'}</div></div>
        <div><span style="color:var(--text3)">Fin estimado</span><div class="td-mono" style="color:var(--text)">${p.fecha_fin_estimada||'—'}</div></div>
        <div><span style="color:var(--text3)">Fin real</span><div class="td-mono" style="color:var(--text)">${p.fecha_fin_real||'—'}</div></div>
        <div><span style="color:var(--text3)">Duración estimada</span><div style="color:var(--text)">${p.duracion_estimada_dias??'—'} día(s)</div></div>
        <div><span style="color:var(--text3)">Duración real</span><div style="color:var(--text)">${p.duracion_real_dias??'—'} día(s)</div></div>
        <div><span style="color:var(--text3)">Personal asignado</span><div style="color:var(--text)">${p.personal_asignado}</div></div>
        <div><span style="color:var(--text3)">Incidencias</span><div style="color:var(--text)">${p.total_incidencias} (${p.incidencias_altas} alta(s))</div></div>
        <div><span style="color:var(--text3)">Días trabajados (checador)</span><div style="color:var(--text)">${p.asistencia?.dias_trabajados ?? 0}</div></div>
        <div><span style="color:var(--text3)">Horas aprox. trabajadas</span><div style="color:var(--text)">${p.asistencia?.horas_aprox ?? 0} h</div></div>
        <div><span style="color:var(--text3)">Días sin checada</span><div style="color:${p.dias_faltantes?'var(--amber)':'var(--text)'}">${p.dias_faltantes ?? 0}</div></div>
      </div>
      ${p.incidencias.length ? `<div style="border-top:1px solid var(--border);padding-top:8px">
        <div style="font-size:11px;color:var(--text3);margin-bottom:6px">POSIBLES CAUSAS (INCIDENCIAS REGISTRADAS)</div>
        ${p.incidencias.map(i=>`<div style="font-size:12px;color:var(--text2);padding:3px 0">• <strong style="color:var(--text)">${i.tipo}</strong> (${i.severidad}) — ${i.descripcion||'sin descripción'} <span style="color:var(--text3)">[${(i.fecha||'').split('T')[0]}]</span></div>`).join('')}
      </div>` : '<div style="font-size:12px;color:var(--text3)">Sin incidencias registradas durante este proyecto.</div>'}
    </div>`).join('')}`;
}

function exportarMetricasPDF() {
  const datos = STATE._ultimasMetricas || [];
  if (!datos.length) { toast('No hay métricas generadas para exportar','error'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;

  doc.setFontSize(16);
  doc.setFont(undefined, 'bold');
  doc.text('Reporte de Métricas de Proyectos', 14, y);
  y += 8;
  doc.setFontSize(9);
  doc.setFont(undefined, 'normal');
  doc.setTextColor(120);
  doc.text(`Generado el ${new Date().toLocaleString('es-MX')} — ${datos.length} proyecto(s)`, 14, y);
  doc.setTextColor(0);
  y += 10;

  datos.forEach((p, idx) => {
    if (y > 250) { doc.addPage(); y = 20; }
    doc.setFontSize(12);
    doc.setFont(undefined, 'bold');
    doc.text(`${idx+1}. ${p.nombre}`, 14, y); y += 6;
    doc.setFont(undefined, 'normal');
    doc.setFontSize(9);
    doc.text(`Cliente: ${p.cliente||'—'}    Ciudad: ${p.ciudad||'—'}`, 14, y); y += 5;
    doc.text(`Inicio estimado: ${p.fecha_inicio_estimada||'—'}    Inicio real: ${p.fecha_inicio_real||'—'}`, 14, y); y += 5;
    doc.text(`Fin estimado: ${p.fecha_fin_estimada||'—'}    Fin real: ${p.fecha_fin_real||'—'}`, 14, y); y += 5;
    const retrasoTxt = p.retraso_dias>0 ? `+${p.retraso_dias} día(s) de retraso` : p.retraso_dias<0 ? `${Math.abs(p.retraso_dias)} día(s) antes de lo estimado` : (p.retraso_dias===0?'A tiempo':'—');
    doc.text(`Resultado: ${retrasoTxt}`, 14, y); y += 5;
    doc.text(`Duración estimada: ${p.duracion_estimada_dias??'—'} día(s)    Duración real: ${p.duracion_real_dias??'—'} día(s)`, 14, y); y += 5;
    doc.text(`Personal asignado: ${p.personal_asignado}    Incidencias: ${p.total_incidencias} (${p.incidencias_altas} alta(s))`, 14, y); y += 5;
    doc.text(`Días trabajados (checador): ${p.asistencia?.dias_trabajados ?? 0}    Horas aprox.: ${p.asistencia?.horas_aprox ?? 0} h    Días sin checada: ${p.dias_faltantes ?? 0}`, 14, y); y += 6;

    if (p.incidencias.length) {
      doc.setFont(undefined, 'italic');
      doc.text('Incidencias registradas (posibles causas):', 14, y); y += 5;
      doc.setFont(undefined, 'normal');
      p.incidencias.forEach(i => {
        if (y > 270) { doc.addPage(); y = 20; }
        const linea = `• ${i.tipo} (${i.severidad}): ${i.descripcion||'sin descripción'}`;
        const wrapped = doc.splitTextToSize(linea, 178);
        doc.text(wrapped, 18, y);
        y += wrapped.length * 4.5;
      });
      y += 2;
    }
    doc.setDrawColor(200);
    doc.line(14, y, 196, y);
    y += 8;
  });

  const nombreArchivo = datos.length === 1 ? datos[0].nombre.replace(/[\\/:*?"<>|]/g,'-') : `${datos.length} proyectos`;
  doc.save(`Metricas - ${nombreArchivo} - ${new Date().toISOString().split('T')[0]}.pdf`);
}

async function subirFotoPerfil(input) {
  const file = input.files[0]; if (!file) return;
  const url = await subirArchivoAPI(file, 'foto-perfil');
  if (url) {
    const empId = STATE.user?.empleado_id;
    if (empId) await api('PATCH', `/empleados/${empId}/perfil`, { foto_perfil_url: url });
    const av = document.getElementById('perfil-av-texto');
    if (av) av.parentElement.style.backgroundImage = `url(${url})`;
    if (av) av.style.display = 'none';
    const sbAv = document.getElementById('sb-avatar');
    if (sbAv) {
      sbAv.style.backgroundImage = `url(${url})`;
      sbAv.style.backgroundSize = 'cover';
      sbAv.style.backgroundPosition = 'center';
      sbAv.textContent = '';
    }
    toast('Foto actualizada');
  }
}

async function subirArchivoAPI(file, nombre) {
  try {
    const fd = new FormData();
    fd.append('file', file);
    const empId = STATE.user?.empleado_id || 'USR-TEMP';
    const url = `${API}/storage/upload?empleado_id=${encodeURIComponent(empId)}&nombre_doc=${encodeURIComponent(nombre)}`;
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${STATE.token}` },
      body: fd
    });
    if (r.ok) {
      const d = await r.json();
      return d.url || null;
    } else {
      const txt = await r.text();
      console.error('Upload error:', r.status, txt);
      // Si falla la API, guardar como base64 local temporalmente
      return await fileToBase64(file);
    }
  } catch(e) {
    console.error('Upload exception:', e);
    return await fileToBase64(file);
  }
}

async function fileToBase64(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

async function guardarHabilidad() {
  const nombre = document.getElementById('hab-nombre')?.value.trim();
  const nivel  = parseInt(document.getElementById('hab-nivel')?.value || '7');
  const fecha  = document.getElementById('hab-fecha')?.value || null;
  const err    = document.getElementById('hab-err');
  if (!nombre) { err.textContent = 'Escribe el nombre de la habilidad.'; return; }
  if (!STATE.perfil_habs) STATE.perfil_habs = [];
  STATE.perfil_habs = STATE.perfil_habs.filter(h => h.nombre.toLowerCase() !== nombre.toLowerCase());
  STATE.perfil_habs.push({ nombre, nivel, ultimo_uso: fecha });
  const ok = await sincronizarHabilidades();
  if (!ok) { err.textContent = 'Error al guardar. Intenta de nuevo.'; return; }
  closePanel(null, true);
  toast(`Habilidad "${nombre}" agregada`);
  cargarCatalogos();
  renderMiPerfil();
}

async function eliminarHabilidad(i) {
  STATE.perfil_habs.splice(i, 1);
  await sincronizarHabilidades();
  toast('Habilidad eliminada');
  renderMiPerfil();
}

async function sincronizarHabilidades() {
  const empId = STATE.user?.empleado_id;
  if (!empId) return false;
  const habilidades = {};
  const historial_habilidades = {};
  (STATE.perfil_habs||[]).forEach(h=>{
    habilidades[h.nombre] = h.nivel;
    if (h.ultimo_uso) historial_habilidades[h.nombre] = h.ultimo_uso;
  });
  const r = await api('POST', `/empleados/${empId}/encuesta`, { habilidades, historial_habilidades });
  return !!r;
}

        <div style="border:1px dashed var(--border2);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;background:var(--input-bg)" onclick="document.getElementById('file-doc').click()">
