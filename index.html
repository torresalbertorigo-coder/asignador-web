<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asignador Inteligente — Walross</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#18181A;--surface:#1E1E21;--surface2:#26262A;
  --border:#323236;--border2:#3D3D42;
  --text:#F5F5F5;--text2:#A3A3A8;--text3:#6E6E74;
  --red:#C1121F;--red2:#8B1A1A;--red-bg:#1a0505;
  --green:#22c55e;--green-bg:#0d2d14;
  --amber:#f59e0b;--amber-bg:#2d1a05;
  --blue:#3b82f6;--blue-bg:#0d1a2d;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',system-ui,sans-serif;
  --radius:3px;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;height:100vh;overflow:hidden}
@media(min-width:1200px){body{font-size:16px}}
button{cursor:pointer;font-family:var(--sans);font-size:14px}
input,select,textarea{font-family:var(--sans);font-size:14px}
a{text-decoration:none;color:inherit}

/* ── LOGIN ───────────────────────────────────────────────────────────── */
#login-screen{display:flex;height:100vh;align-items:center;justify-content:center;background:var(--bg)}
.login-card{background:var(--surface);border:1px solid var(--border);width:360px;padding:32px}
.login-logo{margin-bottom:28px}
.login-brand{font-size:12px;font-weight:700;letter-spacing:.15em;color:var(--text)}
.login-sub{font-size:11px;letter-spacing:.12em;color:var(--red);font-weight:600}
.login-title{font-size:17px;font-weight:600;margin-bottom:4px}
.login-desc{font-size:12px;color:var(--text2);margin-bottom:24px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;color:var(--text3);letter-spacing:.08em;font-weight:600;margin-bottom:6px}
.form-input{width:100%;background:#151517;border:1px solid var(--border2);color:var(--text);padding:9px 12px;border-radius:var(--radius);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--red)}
.form-input::placeholder{color:var(--text3)}
.btn-login{width:100%;background:var(--red);color:#fff;border:none;padding:10px;font-weight:600;border-radius:var(--radius);margin-top:8px;font-size:13px;letter-spacing:.03em;transition:background .15s}
.btn-login:hover{background:#a50e18}
.login-error{color:#ef4444;font-size:12px;margin-top:8px;min-height:16px}
.login-hint{font-size:11px;color:var(--text3);margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

/* ── APP LAYOUT ──────────────────────────────────────────────────────── */
#app{display:none;height:100vh;flex-direction:column}
#app.visible{display:flex}
.app-body{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .18s ease,margin-left .18s ease;overflow:hidden}
@media(min-width:769px){
  .sidebar.collapsed{width:0;border-right:none}
}
.sidebar-brand{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-brand .b1{font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--text)}
.sidebar-brand .b2{font-size:10px;letter-spacing:.12em;color:var(--red);font-weight:600}
.sidebar-user{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-av{width:28px;height:28px;border-radius:3px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:var(--mono);flex-shrink:0}
.user-nm{font-size:12px;font-weight:600;color:var(--text);line-height:1.2}
.user-rol{font-size:10px;color:var(--text3)}
.nav-section{font-size:10px;color:var(--text3);padding:10px 14px 4px;letter-spacing:.1em;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 14px;font-size:12px;color:var(--text2);cursor:pointer;border-left:2px solid transparent;transition:all .12s;user-select:none}
.nav-item:hover{color:var(--text);background:var(--surface2)}
.nav-item.active{color:var(--text);background:var(--surface2);border-left-color:var(--red)}
.nav-item i{font-size:16px;width:16px}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:2px;font-weight:700}
.sidebar-footer{padding:10px 14px;border-top:1px solid var(--border);margin-top:auto}
.api-dot{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text3)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--green)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{padding:0 20px;height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#151517;flex-shrink:0}
.page-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--text)}
.page-title .sep{color:var(--text3);font-weight:400}
.page-title i{color:var(--red);font-size:17px}
.topbar-right{display:flex;gap:8px;align-items:center}
.content{flex:1;overflow-y:auto;padding:20px 28px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--radius);font-size:12px;font-weight:600;border:none;transition:all .12s;cursor:pointer}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a50e18}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}.btn-ghost:hover{color:var(--text);border-color:var(--text3)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-icon{padding:6px;background:transparent;border:1px solid var(--border2);color:var(--text2)}.btn-icon:hover{color:var(--text)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--border);padding:12px 14px;border-radius:var(--radius);border-left:2px solid var(--border)}
.stat-card.c-red{border-left-color:var(--red)}
.stat-card.c-green{border-left-color:var(--green)}
.stat-card.c-amber{border-left-color:var(--amber)}
.stat-card.c-blue{border-left-color:var(--blue)}
.stat-lbl{font-size:10px;color:var(--text3);letter-spacing:.1em;font-weight:600;margin-bottom:5px}
.stat-val{font-size:21px;font-weight:600;font-family:var(--mono);line-height:1;color:var(--text)}
.stat-sub{font-size:10px;color:var(--text3);margin-top:3px}

/* TABLE */
.table-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.table-header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.table-title{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.08em}
.table-meta{font-size:10px;color:var(--text3);font-family:var(--mono)}
table{width:100%;border-collapse:collapse}
th{padding:8px 16px;text-align:left;font-size:11px;color:var(--text3);letter-spacing:.1em;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 16px;font-size:13px;color:var(--text2);border-bottom:1px solid #141414;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2);color:#c8c8c8}
.td-name{color:var(--text);font-weight:500}
.td-mono{font-family:var(--mono);font-size:11px;color:var(--text3)}
.td-action{text-align:right;cursor:pointer}
.td-action i{font-size:14px;color:var(--text3)}
tbody tr:hover .td-action i{color:var(--text2)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:2px;font-size:10px;font-weight:700;letter-spacing:.05em}
.badge-libre{background:var(--green-bg);color:var(--green);border:1px solid #1a4a24}
.badge-asig{background:var(--blue-bg);color:var(--blue);border:1px solid #1a2d4a}
.badge-proy{background:var(--red-bg);color:#ef4444;border:1px solid #4a1a1a}
.badge-mant{background:var(--amber-bg);color:var(--amber);border:1px solid #4a2d05}
.badge-pend{background:#1a1a0d;color:#a3a300;border:1px solid #2d2d00}
.badge-prog{background:var(--blue-bg);color:var(--blue);border:1px solid #1a2d4a}

/* FATIGA BAR */
.fat-wrap{display:flex;align-items:center;gap:6px}
.fat-bar{width:52px;height:3px;background:var(--border2);border-radius:1px;overflow:hidden;flex-shrink:0}
.fat-fill{height:100%;border-radius:1px}
.fat-val{font-size:11px;font-family:var(--mono)}

/* PANEL DERECHO / MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.panel-side{background:var(--surface);border:1px solid var(--border2);border-radius:6px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;background:var(--surface);z-index:1}
.panel-title{font-size:15px;font-weight:600;color:var(--text)}
.panel-body{padding:20px;flex:1}
.panel-section{margin-bottom:20px}
.panel-section-title{font-size:10px;color:var(--text3);letter-spacing:.1em;font-weight:600;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field-row.full{grid-template-columns:1fr}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-label{font-size:11px;color:var(--text3);letter-spacing:.08em;font-weight:600}
.field-input{background:#151517;border:1px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:var(--radius);outline:none;font-size:13px;width:100%}
.field-input:focus{border-color:var(--red)}
.field-select{background:#151517;border:1px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:var(--radius);outline:none;font-size:13px;width:100%;appearance:none}
.panel-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;position:sticky;bottom:0;background:var(--surface)}

/* EMPTY STATE */
.empty-state{padding:40px;text-align:center;color:var(--text3)}
.empty-state i{font-size:33px;margin-bottom:12px;display:block}
.empty-state p{font-size:13px;color:var(--text2);margin-bottom:4px}
.empty-state span{font-size:12px}

/* MOBILE NAV (bottom) */
.mobile-nav{display:none;background:var(--surface);border-top:1px solid var(--border);padding:8px 0 12px}
.mobile-nav-items{display:flex;justify-content:space-around}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text3);cursor:pointer;padding:4px 12px}
.mobile-nav-item.active{color:var(--red)}
.mobile-nav-item i{font-size:21px}
.topbar-menu-btn{display:block;background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:4px}

/* SECCIONES */
.section-page{display:none}
.section-page.active{display:block}

/* GANTT */
.gantt-wrap{overflow-x:auto}
.gantt-table{border-collapse:collapse;min-width:600px}
.gantt-table th{background:var(--surface2);font-size:10px;color:var(--text3);padding:6px 8px;border:1px solid var(--border);letter-spacing:.08em;font-weight:600;white-space:nowrap}
.gantt-table td{border:1px solid var(--border);padding:0;height:32px}
.gantt-name{padding:6px 12px;background:var(--surface);font-size:12px;color:var(--text);min-width:140px;white-space:nowrap}
.gantt-cell{width:28px;background:transparent}
.gantt-cell.today{background:#1a0505;border-left:2px solid var(--red)!important}
.gantt-cell.weekend{background:#151517}
.gantt-cell.occupied{background:var(--red)}
.gantt-cell.assigned{background:var(--blue-bg)}
.gantt-cell.past{background:var(--red2)}

/* EQUIPOS */
.equipo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.equipo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color .12s}
.equipo-card:hover{border-color:var(--border2)}
.equipo-card.selected{border-color:var(--red)}
.eq-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.eq-icon{width:36px;height:36px;background:var(--surface2);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--red);font-size:19px}
.eq-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.eq-type{font-size:11px;color:var(--text3)}
.eq-row{display:flex;justify-content:space-between;margin-top:6px;font-size:11px}
.eq-row span{color:var(--text3)}
.eq-row strong{color:var(--text2);font-family:var(--mono)}

/* EVALUAR */
.eval-config{background:var(--surface);border:1px solid var(--border);padding:14px 16px;border-radius:var(--radius);margin-bottom:16px;display:flex;gap:12px;align-items:flex-end}
.eval-result-section{margin-bottom:14px}
.eval-section-title{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.06em;margin-bottom:8px;padding-left:8px;border-left:2px solid var(--red)}
.candidato-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;transition:border-color .12s}
.candidato-card.top{border-color:var(--green)}
.candidato-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.candidato-name{font-size:14px;font-weight:600;color:var(--text)}
.candidato-sub{font-size:11px;color:var(--text3);margin-top:2px}
.candidato-score{font-size:23px;font-weight:700;font-family:var(--mono);color:var(--green)}
.score-max{font-size:12px;color:var(--text3)}
.criterio-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.criterio-name{font-size:11px;color:var(--text2);width:80px;flex-shrink:0}
.criterio-bar-wrap{flex:1;height:3px;background:var(--border2);border-radius:1px;overflow:hidden}
.criterio-bar-fill{height:100%;background:var(--green);border-radius:1px}
.criterio-val{font-size:11px;font-family:var(--mono);color:var(--text2);width:45px;text-align:right;flex-shrink:0}
.brecha-item-rojo{display:flex;align-items:center;gap:6px;font-size:11px;color:#ef4444;padding:3px 0}
.brecha-item-rojo::before{content:'·';color:#ef4444}
.brecha-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--amber);padding:3px 0}
.brecha-item::before{content:'·';color:var(--amber)}

/* INCIDENCIAS */
.inc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.inc-card.alta{border-left:3px solid #ef4444}
.inc-card.media{border-left:3px solid var(--amber)}
.inc-card.baja{border-left:3px solid var(--green)}
.inc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.inc-tipo{font-size:13px;font-weight:600;color:var(--text)}
.inc-meta{font-size:11px;color:var(--text3);margin-top:4px}
.inc-desc{font-size:12px;color:var(--text2);background:var(--surface2);padding:8px 10px;border-radius:var(--radius);margin-top:8px}

/* PERFIL TÉCNICO */
.perfil-header{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;display:flex;align-items:center;gap:16px}
.perfil-av{width:56px;height:56px;border-radius:4px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#fff;font-family:var(--mono);flex-shrink:0;position:relative;cursor:pointer}
.perfil-av-edit{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;background:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.perfil-info h2{font-size:16px;font-weight:600;color:var(--text);margin-bottom:3px}
.perfil-info p{font-size:12px;color:var(--text2);margin-bottom:6px}

/* CHECADOR */
.check-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;text-align:center}
.check-time{font-size:37px;font-weight:700;font-family:var(--mono);color:var(--text);margin-bottom:4px}
.check-date{font-size:12px;color:var(--text2);margin-bottom:20px}
.check-status{font-size:12px;color:var(--text3);margin-top:12px}
.check-btns{display:flex;gap:10px;justify-content:center}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border2);padding:12px 16px;border-radius:var(--radius);font-size:13px;color:var(--text);z-index:999;display:none;align-items:center;gap:10px;min-width:240px;max-width:340px}
.toast.show{display:flex}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid #ef4444}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{display:none}.sidebar.mobile-open{display:flex;position:fixed;z-index:200;height:100vh}
  .mobile-nav{display:block}
  .topbar-menu-btn{display:block}
  .stats-grid{grid-template-columns:1fr 1fr}
  .equipo-grid{grid-template-columns:1fr}
  .eval-config{flex-direction:column}
  .field-row{grid-template-columns:1fr}
  .panel-side{width:100vw}
}.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-monthlabel{font-size:14px;font-weight:600;color:var(--text);text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-weekday{font-size:10px;color:var(--text3);text-align:center;padding:4px 0;font-weight:600}
.cal-cell{aspect-ratio:1;border-radius:4px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--text2);position:relative;cursor:default}
.cal-cell.empty{background:transparent}
.cal-cell.hoy{outline:1.5px solid var(--red);color:var(--text)}
.cal-cell.ocupado{background:var(--green-bg);color:var(--green);cursor:pointer;font-weight:600}
.cal-cell.ocupado.hoy{outline:1.5px solid var(--green)}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--green);position:absolute;bottom:4px}
</style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-brand">WALROSS</div>
      <div class="login-sub">TECH & INNOVATION</div>
    </div>
    <div class="login-title">Asignador Inteligente</div>
    <div class="login-desc">Sistema de asignación de personal técnico de campo</div>
    <div class="form-group">
      <label class="form-label">CORREO</label>
      <input id="login-email" class="form-input" type="email" placeholder="tu@walross.mx" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">CONTRASEÑA</label>
      <input id="login-pass" class="form-input" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="login-error" class="login-error"></div>
    <button class="btn-login" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-hint">Acceso exclusivo para personal autorizado Walross</div>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────────────────── -->
<datalist id="dl-habilidades"></datalist>
<datalist id="dl-certificados"></datalist>
<div id="app">
  <div class="app-body">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="b1">WALROSS</div>
        <div class="b2">ASIGNADOR INTELIGENTE</div>
      </div>
      <div class="sidebar-user" onclick="showSection('mi-perfil')" style="cursor:pointer" title="Ver mi perfil">
        <div class="user-av" id="sb-avatar">RT</div>
        <div>
          <div class="user-nm" id="sb-name">Usuario</div>
          <div class="user-rol" id="sb-rol">Cargando...</div>
        </div>
      </div>
      <div id="admin-nav"></div>
      <div id="tecnico-nav"></div>
      <div class="sidebar-footer">
        <div class="api-dot"><div class="dot"></div> API conectada</div>
        <div style="margin-top:8px">
          <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="width:100%;justify-content:center">
            <i class="ti ti-logout" aria-hidden="true"></i> Cerrar sesión

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const err   = document.getElementById('login-error');
  const btn   = document.getElementById('login-btn');
  if (!email || !pass) { err.textContent = 'Completa los campos.'; return; }
  btn.textContent = 'Conectando...'; btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch(`${API}/auth/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.detail || 'Credenciales incorrectas.'; return; }
    STATE.token = d.access_token;
    STATE.rol   = d.rol;
    STATE.user  = { nombre: d.nombre, email, empleado_id: d.empleado_id };
    localStorage.setItem('w_token', d.access_token);
    localStorage.setItem('w_rol', d.rol);
    localStorage.setItem('w_nombre', d.nombre);
    localStorage.setItem('w_email', email);
    localStorage.setItem('w_emp_id', d.empleado_id || '');
    initApp();
  } catch(e) { err.textContent = 'Sin conexión a la API.'; }
  finally { btn.textContent = 'Entrar'; btn.disabled = false; }
}

document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function api(method, path, body) {
  const opts = { method, headers: { 'Authorization': `Bearer ${STATE.token}`, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (r.status === 401) { doLogout(); return null; }
  return r.ok ? r.json() : null;
}

  ]);

  const dlCerts = document.getElementById('dl-certificados');
  if (dlHabs && habs) dlHabs.innerHTML = habs.map(n=>`<option value="${n.replace(/"/g,'&quot;')}">`).join('');
  if (dlCerts && certs) dlCerts.innerHTML = certs.map(n=>`<option value="${n.replace(/"/g,'&quot;')}">`).join('');
}

// ─── CALENDARIO MENSUAL (popup reutilizable: admin y técnico) ────────────────
STATE._cal_offset = 0;

function eventosProyectosPorDia(empId) {
  const mapa = {};
  (STATE.proyectos||[]).filter(p => (p.tecnicos_asignados||[]).includes(empId) && p.fecha_inicio && p.fecha_fin_estimada)
    .forEach(p => {
      let d = new Date(p.fecha_inicio);
      const fin = new Date(p.fecha_fin_estimada);
      while (d <= fin) {
        const key = d.toISOString().split('T')[0];
        if (!mapa[key]) mapa[key] = [];
        mapa[key].push(p);
        d.setDate(d.getDate()+1);
      }
    });
  return mapa;
}

async function abrirCalendarioMensual(empId, nombre, offsetMeses) {
  STATE._cal_offset = offsetMeses || 0;
  await loadProyectos();
  const hoy = new Date();
  const base = new Date(hoy.getFullYear(), hoy.getMonth() + STATE._cal_offset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const eventos = eventosProyectosPorDia(empId);
  const primerDia = new Date(year, month, 1);
  const diasEnMes = new Date(year, month+1, 0).getDate();
  const offset = primerDia.getDay();
  let celdas = '';
  for (let i=0;i<offset;i++) celdas += `<div class="cal-cell empty"></div>`;
  for (let d=1; d<=diasEnMes; d++) {
    const fecha = new Date(year, month, d);
    const key = fecha.toISOString().split('T')[0];
    const evs = eventos[key] || [];
    const esHoy = fecha.toDateString() === hoy.toDateString();
    const nombres = evs.map(p=>p.nombre).join(', ');
    const click = evs.length ? ` onclick="verProyecto('${evs[0].id}')"` : '';
    celdas += `<div class="cal-cell ${esHoy?'hoy':''} ${evs.length?'ocupado':''}" title="${nombres.replace(/"/g,'&quot;')}"${click}>${d}${evs.length?'<div class="cal-dot"></div>':''}</div>`;
  }
  const mesLabel = base.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  openPanel(`Calendario — ${nombre}`, `
    <div class="panel-section">
      <div class="cal-header">
        <button class="btn btn-ghost btn-sm" onclick="abrirCalendarioMensual('${empId}','${nombre.replace(/'/g,"\\'")}',${STATE._cal_offset-1})"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
        <span class="cal-monthlabel">${mesLabel}</span>
        <button class="btn btn-ghost btn-sm" onclick="abrirCalendarioMensual('${empId}','${nombre.replace(/'/g,"\\'")}',${STATE._cal_offset+1})"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
      </div>
      <div class="cal-grid">
        ${['D','L','M','X','J','V','S'].map(w=>`<div class="cal-weekday">${w}</div>`).join('')}
        ${celdas}
      </div>
      <div style="margin-top:10px;font-size:11px;color:var(--text3)">● Días con proyecto asignado — toca un día para ver el detalle del proyecto.</div>
    </div>`,
    `<button class="btn btn-ghost btn-sm" onclick="closePanel(null,true)">Cerrar</button>`);
}

// ─── HELPER UI ────────────────────────────────────────────────────────────────
function html(el) { document.getElementById('main-content').innerHTML = el; }

function estadoVisible(e) {
  // El estado guardado en BD siempre es 'en_proyecto' desde el momento de
  // la asignación (lo necesita el motor para otros cálculos). Aquí solo
  // se calcula qué ETIQUETA mostrar, sin tocar el dato real:
  //   > 2 días antes de iniciar  → "Asignado"
  //   2 días antes hasta iniciar → "En preparación"
  //   ya dentro de las fechas    → "En proyecto"
  if (e.disponibilidad !== 'en_proyecto' || !e.id_proyecto_actual) return e.disponibilidad;
  const pry = (STATE.proyectos||[]).find(p => p.id === e.id_proyecto_actual);
  if (!pry || !pry.fecha_inicio) return e.disponibilidad;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const inicio = new Date(pry.fecha_inicio);
  const diasHastaInicio = Math.ceil((inicio - hoy) / 86400000);
  if (diasHastaInicio > 2) return 'asignado';
  if (diasHastaInicio > 0) return 'en_preparacion';
  return 'en_proyecto';
}

function badge(val) {
  const map = { libre:'badge-libre LIBRE', asignado:'badge-asig ASIGNADO', en_proyecto:'badge-proy EN PROYECTO',
    mantenimiento:'badge-mant MANT.', pendiente_asignacion:'badge-pend PENDIENTE', en_progreso:'badge-prog EN PROG.',
    pausado:'badge-mant PAUSADO', completado:'badge-libre COMPLETADO', cancelado:'badge-proy CANCELADO',
    en_preparacion:'badge-mant EN PREPARACIÓN',
    disponible:'badge-libre DISPONIBLE' };
  const [cls, lbl] = (map[val] || 'badge-pend ' + val).split(' ').reduce((a,c,i)=>i===0?[c,a[1]]:[a[0],a[1]+(i>1?' ':'')+c], ['','']);
  return `<span class="badge ${cls}">${(map[val]||'').split(' ').slice(1).join(' ')||val.toUpperCase()}</span>`;
}

function fatiga(val) {
  const pct = Math.min(100, val || 0);
  const col = pct < 40 ? 'var(--green)' : pct < 75 ? 'var(--amber)' : '#ef4444';
  return `<div class="fat-wrap"><div class="fat-bar"><div class="fat-fill" style="width:${pct}%;background:${col}"></div></div><span class="fat-val" style="color:${col}">${pct}/100</span></div>`;
}

async function cargarPerfil() {
  const empId = STATE.user?.empleado_id;
  if (!empId) return;
  try {
    const d = await api('GET', `/empleados/${empId}`);
    if (d) {
      const habs = d.habilidades_declaradas || {};
      const hist = d.historial_habilidades_declarado || {};
      STATE.perfil_habs = Object.keys(habs).map(nombre => ({
        nombre, nivel: habs[nombre], ultimo_uso: hist[nombre] || null
      }));
      STATE.perfil_docs = (d.certificados || []).map(c => ({
        id: c.id, nombre: c.nombre, tipo: c.tipo || '—', institucion: c.institucion,
        sin_vigencia: !c.fecha_vencimiento, vigencia: c.fecha_vencimiento,
        desde: c.fecha_expedicion, url: c.ruta_pdf
      }));
    }
  } catch(e) { console.error('Error cargando perfil:', e); }
}

  const dl      = document.getElementById('visor-dl');
  titulo.textContent = nombre || 'Documento';
  dl.href = url;
  dl.download = nombre || 'documento';
  const ext = (url.split('?')[0].split('.').pop() || '').toLowerCase();
  const esImagen = ['jpg','jpeg','png','gif','webp'].includes(ext) || url.startsWith('data:image');
  const esPDF = ext === 'pdf' || url.startsWith('data:application/pdf');
  if (esImagen) {
    body.innerHTML = `<img src="${url}" style="max-width:100%;max-height:calc(100vh - 100px);object-fit:contain;border-radius:4px">`;
  } else if (esPDF) {
    body.innerHTML = `<iframe src="${url}" style="width:min(900px,95vw);height:calc(100vh - 100px);border:none;border-radius:4px;background:#fff"></iframe>`;
  } else {
    body.innerHTML = `<div style="text-align:center;color:#888"><i class="ti ti-file" style="font-size:49px;display:block;margin-bottom:12px" aria-hidden="true"></i><p style="font-size:15px;margin-bottom:16px">${nombre}</p><a href="${url}" download="${nombre}" style="display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:#C1121F;color:#fff;border-radius:3px;text-decoration:none;font-size:13px;font-weight:600"><i class="ti ti-download" aria-hidden="true"></i> Descargar archivo</a></div>`;
  }
  overlay.style.display = 'flex';
}

function cerrarVisor(e, force) {
  if (force || e?.target === document.getElementById('visor-overlay')) {
    document.getElementById('visor-overlay').style.display = 'none';
    document.getElementById('visor-body').innerHTML = '';
  }
}

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast-icon').className = type === 'success' ? 'ti ti-check' : 'ti ti-x';
  t.className = `toast show ${type}`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function guardarNuevoTecnico() {
  const nombre   = document.getElementById('nt-nombre')?.value.trim();
  const apellido = document.getElementById('nt-apellido')?.value.trim();
  const email    = document.getElementById('nt-email')?.value.trim();
  const pass     = document.getElementById('nt-pass')?.value.trim();
  const nivel    = document.getElementById('nt-nivel')?.value;
  const ciudad   = document.getElementById('nt-ciudad')?.value.trim();
  const estado   = document.getElementById('nt-estado')?.value.trim();
  const tel      = document.getElementById('nt-tel')?.value.trim();
  const err      = document.getElementById('nt-err');
  if (!nombre || !apellido || !email || !pass || !nivel || !ciudad) {
    err.textContent = 'Completa todos los campos obligatorios.'; return;
  }
  const id_emp = `EMP-${nombre[0].toUpperCase()}${apellido.slice(0,3).toUpperCase()}`;
  const r2 = await api('POST', '/empleados', {
    id: id_emp, nombre, apellido, seniority: nivel,
    ciudad, estado: estado || '', pais: 'México',
    latitud: 0, longitud: 0, telefono: tel, email: email
  });
  if (!r2) { err.textContent = 'Error al crear el técnico. Verifica que el correo no esté registrado.'; return; }
  const r1 = await api('POST', '/auth/auth/usuarios', {
    id: `USR-${nombre[0].toUpperCase()}${apellido.slice(0,3).toUpperCase()}`,
    nombre: `${nombre} ${apellido}`, email, password: pass, rol: 'tecnico', empleado_id: id_emp
  });
  if (r1) {
    const r3 = await api('PUT', `/empleados/${id_emp}/perfil-estado`, { nuevo_estado: 'activo' });
    if (!r3) console.warn('No se pudo activar automáticamente el perfil del nuevo técnico.');
    await loadEmpleados();
    closePanel(null, true);
    toast(`Técnico ${nombre} ${apellido} creado — ID: ${id_emp}`);
    renderEmpleados();
  } else {
    err.textContent = 'El perfil del técnico se creó, pero falló crear su usuario de acceso (¿correo ya registrado?).';
  }
}

async function cambiarEstadoProyecto(id, nuevoEstado) {
  const r = await api('PATCH', `/proyectos/proyectos/${id}/estado`, { nuevo_estado: nuevoEstado });

  toast(r.mensaje || 'Proyecto actualizado');
  await loadProyectos();
  await loadEmpleados();
  verProyecto(id);
}

async function eliminarProyectoConfirm(id) {
  const p = STATE.proyectos.find(x=>x.id===id);
  if (!p) return;
  if (!confirm(`¿Eliminar el proyecto "${p.nombre}" definitivamente? Esta acción no se puede deshacer.`)) return;
  const r = await api('DELETE', `/proyectos/proyectos/${id}`);
  if (!r) { toast('Error al eliminar el proyecto','error'); return; }
  toast(r.mensaje || 'Proyecto eliminado');
  closePanel(null, true);
  await loadProyectos();
  renderProyectos();
}

function renderListaHabilidadesProyecto() {
  const list = STATE._np_habilidades || [];
  if (!list.length) return '<div style="font-size:12px;color:var(--text3)">Ninguna agregada — el proyecto no exigirá nivel mínimo de habilidades.</div>';
  return list.map((h,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
    <span>${h.nombre} — nivel mín. ${h.nivel}</span>
    <button class="btn btn-ghost btn-sm" onclick="quitarHabilidadProyecto(${i})" style="padding:2px 6px"><i class="ti ti-x" aria-hidden="true"></i></button>
  </div>`).join('');
}
function agregarHabilidadProyecto() {
  const nombre = document.getElementById('np-hab-nombre')?.value.trim();
  const nivel  = parseInt(document.getElementById('np-hab-nivel')?.value || '5');
  if (!nombre) return;
  if (!STATE._np_habilidades) STATE._np_habilidades = [];
  STATE._np_habilidades = STATE._np_habilidades.filter(h=>h.nombre.toLowerCase()!==nombre.toLowerCase());
  STATE._np_habilidades.push({ nombre, nivel });
  document.getElementById('np-hab-nombre').value = '';
  document.getElementById('np-habs-list').innerHTML = renderListaHabilidadesProyecto();
}
function quitarHabilidadProyecto(i) {
  STATE._np_habilidades.splice(i,1);
  document.getElementById('np-habs-list').innerHTML = renderListaHabilidadesProyecto();
}

function renderListaCertificadosProyecto() {
  const list = STATE._np_certificados || [];
  if (!list.length) return '<div style="font-size:12px;color:var(--text3)">Ninguno agregado — el proyecto no exigirá certificados.</div>';
  return list.map((c,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
    <span>${c}</span>
    <button class="btn btn-ghost btn-sm" onclick="quitarCertificadoProyecto(${i})" style="padding:2px 6px"><i class="ti ti-x" aria-hidden="true"></i></button>
  </div>`).join('');
}
function agregarCertificadoProyecto() {
  const nombre = document.getElementById('np-cert-nombre')?.value.trim();
  if (!nombre) return;
  if (!STATE._np_certificados) STATE._np_certificados = [];
  if (!STATE._np_certificados.includes(nombre)) STATE._np_certificados.push(nombre);
  document.getElementById('np-cert-nombre').value = '';
  document.getElementById('np-certs-list').innerHTML = renderListaCertificadosProyecto();
}
function quitarCertificadoProyecto(i) {
  STATE._np_certificados.splice(i,1);
  document.getElementById('np-certs-list').innerHTML = renderListaCertificadosProyecto();
}

async function guardarNuevoProyecto() {
  const nombre   = document.getElementById('np-nombre')?.value.trim();
  const cliente  = document.getElementById('np-cliente')?.value.trim();
  const crit     = document.getElementById('np-crit')?.value;
  const intens   = document.getElementById('np-intens')?.value;
  const inicio   = document.getElementById('np-inicio')?.value;
  const fin      = document.getElementById('np-fin')?.value;
  const personal = document.getElementById('np-personal')?.value;
  const ciudad   = document.getElementById('np-ciudad')?.value.trim();
  const estadoUb = document.getElementById('np-estado')?.value.trim();
  const presup   = document.getElementById('np-presup')?.value;
  const err      = document.getElementById('np-err');
  if (!nombre || !inicio || !fin || !ciudad) { err.textContent = 'Nombre, fechas y ciudad son obligatorios.'; return; }
  const id_pry = `PRY-${Date.now().toString(36).toUpperCase()}`;
  const habilidades_requeridas = {};
  (STATE._np_habilidades||[]).forEach(h=>{ habilidades_requeridas[h.nombre] = h.nivel; });
  const certificados_requeridos = (STATE._np_certificados||[]).slice();
  const r = await api('POST', '/proyectos/proyectos', {
    id: id_pry, nombre, cliente, criticidad: crit, intensidad: intens,
    fecha_inicio: inicio, fecha_fin_estimada: fin,
    personal_requerido: parseInt(personal)||1,
    presupuesto_viaticos: parseFloat(presup)||0,
    ciudad, estado_ub: estadoUb, pais: 'México',
    latitud: 0, longitud: 0,
    habilidades_requeridas, certificados_requeridos, equipos_requeridos: []
  });
  if (r) {
    await loadProyectos();
    closePanel(null, true);
    toast(`Proyecto "${nombre}" creado`);
    renderProyectos();
  } else { err.textContent = 'Error al crear el proyecto.'; }
}

async function renderGantt() {
  await loadEmpleados(); await loadProyectos();
  const today = new Date();
  const dias = 30;
  const cols = Array.from({length:dias}, (_,i) => { const d = new Date(today); d.setDate(d.getDate()-7+i); return d; });
  const hoy = today.toDateString();
  html(`
    <div class="table-section">
      <div class="table-header"><span class="table-title">CALENDARIO DE DISPONIBILIDAD — 30 DÍAS</span><span class="table-meta">hoy: ${today.toLocaleDateString('es-MX')}</span></div>
      <div class="gantt-wrap">
        <table class="gantt-table">
          <thead><tr>
            <th style="min-width:140px">TÉCNICO</th>
            ${cols.map(d=>`<th style="min-width:28px;text-align:center;${d.toDateString()===hoy?'color:var(--red)':''}">${d.getDate()}<br><span style="font-size:9px">${['D','L','M','X','J','V','S'][d.getDay()]}</span></th>`).join('')}
          </tr></thead>
          <tbody>
            ${STATE.empleados.map(e=>`<tr>
              <td class="gantt-name" style="cursor:pointer" onclick="abrirCalendarioMensual('${e.id}','${(e.nombre+' '+e.apellido).replace(/'/g,"\\'")}',0)">${e.nombre} ${e.apellido}</td>
              ${cols.map(d=>{
                const isHoy = d.toDateString() === hoy;
                const isWknd = d.getDay()===0||d.getDay()===6;
                const pry = STATE.proyectos.find(p => (p.tecnicos_asignados||[]).includes(e.id) && p.fecha_inicio && p.fecha_fin_estimada && new Date(p.fecha_inicio)<=d && new Date(p.fecha_fin_estimada)>=d);
                let cls = isHoy ? 'gantt-cell today' : isWknd ? 'gantt-cell weekend' : 'gantt-cell';
                if (pry) cls += d < today ? ' past' : ' occupied';
                const tip = pry ? `${pry.nombre}${pry.cliente?' · '+pry.cliente:''} (${pry.fecha_inicio} → ${pry.fecha_fin_estimada})`.replace(/"/g,'&quot;') : '';
                const click = pry ? ` onclick="verProyecto('${pry.id}')" style="cursor:pointer"` : '';
                return `<td class="${cls}" title="${tip}"${click}></td>`;
              }).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div style="padding:12px 16px;display:flex;gap:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)"><div style="width:12px;height:8px;background:var(--red)"></div> Días completados</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)"><div style="width:12px;height:8px;background:var(--red2)"></div> Días pasados (proyecto)</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)"><div style="width:12px;height:8px;background:#151517;border:1px solid var(--border)"></div> Fin de semana</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)"><div style="width:2px;height:16px;background:var(--red)"></div> Hoy</div>
      </div>
    </div>`);
}

  html(`

    ${pendientes.length===0?'<div class="empty-state"><i class="ti ti-check-circle" aria-hidden="true"></i><p>No hay proyectos pendientes de asignación</p><span>Todos los proyectos están asignados o en progreso</span></div>':''}`);

async function ejecutarEvaluacion() {
  const pid = document.getElementById('ev-proyecto')?.value;
  if (!pid) { toast('Selecciona un proyecto primero','error'); return; }
  const resultsEl = document.getElementById('ev-results');
  resultsEl.innerHTML = '<div class="empty-state"><i class="ti ti-loader-2" aria-hidden="true"></i><p>Ejecutando motor de asignación...</p></div>';

  const r = await api('GET', `/proyectos/proyectos/${pid}/evaluar`);
  if (!r) { resultsEl.innerHTML = '<div class="empty-state"><i class="ti ti-alert-triangle" aria-hidden="true"></i><p>Error al ejecutar la evaluación.</p></div>'; return; }

  const { proyecto_nombre, aprobados, descartados, mensaje_si_vacio } = r;
  const labels = { habilidades:'Habilidades', fatiga:'Fatiga', recencia:'Recencia', seniority:'Seniority', cercania:'Cercanía' };
  const amarillos = descartados.filter(d=>d.nivel==='amarillo');
  const rojos = descartados.filter(d=>d.nivel!=='amarillo');

  let html_out = `<div style="background:var(--surface);border:1px solid var(--border);padding:10px 14px;border-radius:var(--radius);margin-bottom:14px;font-size:12px">
    <strong style="color:var(--text)">Evaluación — ${proyecto_nombre}</strong>
    <span style="color:var(--green);margin-left:12px">● ${aprobados.length} aprobados</span>
    <span style="color:var(--amber);margin-left:8px">● ${amarillos.length} podrían aprobarse</span>
    <span style="color:#ef4444;margin-left:8px">● ${rojos.length} descartados</span>
  </div>`;

  if (aprobados.length) {
    html_out += `<div class="eval-section-title">CANDIDATOS APROBADOS</div>`;
    aprobados.forEach((c)=>{
      const top = c.posicion===1;
      const topClass = top?'candidato-card top':'candidato-card';
      html_out += `<div class="${topClass}">
        <div class="candidato-head">
          <div><div class="candidato-name">${top?'<span style="color:var(--green);margin-right:6px">①</span>':''}${c.nombre}</div><div class="candidato-sub">${c.recomendacion}${c.alerta_fatiga?' · ⚠️ fatiga alta':''}</div></div>
          <div style="text-align:right"><div class="candidato-score">${c.puntaje_total}<span class="score-max">/100</span></div></div>
        </div>
        ${['habilidades','fatiga','recencia','seniority','cercania'].map(key=>{
          const d = c.desglose[key];
          return `<div class="criterio-row" title="${d.justificacion||''}"><span class="criterio-name">${labels[key]}</span><div class="criterio-bar-wrap"><div class="criterio-bar-fill" style="width:${d.porcentaje}%"></div></div><span class="criterio-val">${d.puntos}/${d.maximo}</span></div>`;
        }).join('')}
        <div style="display:flex;justify-content:flex-end;margin-top:10px;gap:8px">
          <span style="display:inline-flex;align-items:center;padding:3px 10px;border-radius:2px;font-size:11px;font-weight:700;background:var(--green-bg);color:var(--green);border:1px solid #1a4a24">${c.recomendacion}</span>
          <button class="btn btn-primary btn-sm" onclick="asignarTecnico('${c.id_empleado}','${pid}')"><i class="ti ti-user-plus" aria-hidden="true"></i> Asignar</button>
        </div>
      </div>`;
    });
  }

  if (amarillos.length) {
    html_out += `<div class="eval-section-title" style="margin-top:14px;border-left-color:var(--amber)">PODRÍAN APROBARSE — les falta una sola cosa</div>`;
    amarillos.forEach(d=>{
      html_out += `<div style="background:var(--amber-bg);border:1px solid #4a2d05;border-radius:var(--radius);padding:12px 14px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:600;color:var(--text)">${d.nombre}</span>
          <span style="font-size:11px;color:var(--text3)">${d.filtro_falla}</span>
        </div>
        <div class="brecha-item">${d.razon}</div>
      </div>`;
    });
  }

  if (rojos.length) {
    html_out += `<div class="eval-section-title" style="margin-top:14px;border-left-color:#ef4444">DESCARTADOS — varios pendientes a la vez</div>`;
    rojos.forEach(d=>{
      html_out += `<div style="background:var(--red-bg);border:1px solid #4a1a1a;border-radius:var(--radius);padding:12px 14px;margin-bottom:8px">
        <div style="font-weight:600;color:var(--text);margin-bottom:6px">${d.nombre}</div>
        ${(d.filtros_fallidos||[{filtro:d.filtro_falla,razon:d.razon}]).map(f=>
          `<div class="brecha-item-rojo"><span style="color:#f87171;font-size:11px">${f.filtro}:</span> ${f.razon}</div>`
        ).join('')}
      </div>`;
    });
  }

  if (mensaje_si_vacio) {
    html_out += `<div class="empty-state"><i class="ti ti-alert-circle" aria-hidden="true"></i><p>${mensaje_si_vacio}</p></div>`;
  }

  resultsEl.innerHTML = html_out;
}

async function asignarTecnico(empId, pryId) {
  const r = await api('POST', `/proyectos/proyectos/${pryId}/asignar/${empId}`);
  if (!r) { toast('Error al asignar el técnico','error'); return; }
  toast(r.mensaje || 'Técnico asignado al proyecto');
  await loadProyectos();
  await loadEmpleados();
  ejecutarEvaluacion();
}

async function subirFotoPerfil(input) {
  const file = input.files[0]; if (!file) return;
  const url = await subirArchivoAPI(file, 'foto-perfil');
  if (url) {
    const av = document.getElementById('perfil-av-texto');
    if (av) av.parentElement.style.backgroundImage = `url(${url})`;
    toast('Foto actualizada');
  }
}

async function subirArchivoAPI(file, nombre) {
  try {
    const fd = new FormData();
    fd.append('file', file);
    const empId = STATE.user?.empleado_id || 'USR-TEMP';
    const url = `${API}/storage/upload?empleado_id=${encodeURIComponent(empId)}&nombre_doc=${encodeURIComponent(nombre)}`;
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${STATE.token}` },
      body: fd
    });
    if (r.ok) {
      const d = await r.json();
      return d.url || null;
    } else {
      const txt = await r.text();
      console.error('Upload error:', r.status, txt);
      // Si falla la API, guardar como base64 local temporalmente
      return await fileToBase64(file);
    }
  } catch(e) {
    console.error('Upload exception:', e);
    return await fileToBase64(file);
  }
}

async function fileToBase64(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

async function guardarHabilidad() {
  const nombre = document.getElementById('hab-nombre')?.value.trim();
  const nivel  = parseInt(document.getElementById('hab-nivel')?.value || '7');
  const fecha  = document.getElementById('hab-fecha')?.value || null;
  const err    = document.getElementById('hab-err');
  if (!nombre) { err.textContent = 'Escribe el nombre de la habilidad.'; return; }
  if (!STATE.perfil_habs) STATE.perfil_habs = [];
  STATE.perfil_habs = STATE.perfil_habs.filter(h => h.nombre.toLowerCase() !== nombre.toLowerCase());
  STATE.perfil_habs.push({ nombre, nivel, ultimo_uso: fecha });
  const ok = await sincronizarHabilidades();
  if (!ok) { err.textContent = 'Error al guardar. Intenta de nuevo.'; return; }
  closePanel(null, true);
  toast(`Habilidad "${nombre}" agregada`);
  renderMiPerfil();
}

async function eliminarHabilidad(i) {
  STATE.perfil_habs.splice(i, 1);
  await sincronizarHabilidades();
  toast('Habilidad eliminada');
  renderMiPerfil();
}

async function sincronizarHabilidades() {
  const empId = STATE.user?.empleado_id;
  if (!empId) return false;
  const habilidades = {};
  const historial_habilidades = {};
  (STATE.perfil_habs||[]).forEach(h=>{
    habilidades[h.nombre] = h.nivel;
    if (h.ultimo_uso) historial_habilidades[h.nombre] = h.ultimo_uso;
  });
  const r = await api('POST', `/empleados/${empId}/encuesta`, { habilidades, historial_habilidades });
  return !!r;
}

  openPanel('Agregar documento', `
    <div class="panel-section">
      <div class="panel-section-title">DATOS DEL DOCUMENTO</div>
      <div class="field-row full"><div class="field-group"><label class="field-label">TIPO</label>
        <select class="field-select" id="doc-tipo" onchange="toggleVigencia(this.value)">
          ${TIPOS_DOC.map(t=>`<option value="${t}">${t}</option>`).join('')}
        </select>
      </div></div>
      <div class="field-row full"><div class="field-group"><label class="field-label">NOMBRE / NÚMERO</label><input class="field-input" id="doc-nombre" list="dl-certificados" placeholder="Ej: Licencia Federal Tipo E, CURP TOSR..."></div></div>
      <div class="field-row full"><div class="field-group"><label class="field-label">INSTITUCIÓN EMISORA</label><input class="field-input" id="doc-inst" placeholder="Opcional"></div></div>
      <div id="vig-section" style="margin-top:10px">
        <div class="field-row" id="vig-fecha-row">
          <div class="field-group"><label class="field-label">VIGENCIA DESDE</label><input class="field-input" id="doc-desde" type="date"></div>
          <div class="field-group"><label class="field-label">VIGENCIA HASTA</label><input class="field-input" id="doc-hasta" type="date"></div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer;font-size:13px;color:var(--text2)">
          <input type="checkbox" id="doc-sinvig" onchange="toggleFechaVig(this.checked)"> Este documento no tiene vigencia (CURP, Acta de Nacimiento...)
        </label>
      </div>
      <div style="margin-top:14px">
        <label class="field-label" style="margin-bottom:8px">ARCHIVO (PDF o imagen)</label>
        <div style="border:1px dashed var(--border2);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;background:#151517" onclick="document.getElementById('file-doc').click()">
          <i class="ti ti-upload" style="font-size:25px;color:var(--text3)" aria-hidden="true"></i>
          <p id="doc-file-name" style="font-size:12px;color:var(--text3);margin-top:6px">Toca para subir archivo</p>
          <p style="font-size:11px;color:var(--text3);margin-top:2px">PDF, JPG, PNG — máx. 10 MB</p>
        </div>
      </div>
    </div>
    <div id="doc-err" style="color:#ef4444;font-size:12px;margin-top:8px"></div>`,
    `<button class="btn btn-ghost btn-sm" onclick="closePanel(null,true)">Cancelar</button><button class="btn btn-primary btn-sm" onclick="guardarDocumento()"><i class="ti ti-check" aria-hidden="true"></i> Guardar</button>`);
  STATE._doc_file = null;
}

function toggleFechaVig(checked) {
  const row = document.getElementById('vig-fecha-row');
  if (row) row.style.opacity = checked ? '0.3' : '1';
  const d = document.getElementById('doc-desde');
  const h = document.getElementById('doc-hasta');
  if (d) d.disabled = checked;
  if (h) h.disabled = checked;
}

function toggleVigencia(tipo) {
  const noVig = ['CURP','RFC'];
  const cb = document.getElementById('doc-sinvig');
  if (cb && noVig.includes(tipo)) { cb.checked = true; toggleFechaVig(true); }
}

function archivoDocSeleccionado(input) {
  const file = input.files[0];
  if (file) {
    STATE._doc_file = file;
    const el = document.getElementById('doc-file-name');
    if (el) el.textContent = '📄 ' + file.name;
  }
}

async function guardarDocumento() {
  const nombre  = document.getElementById('doc-nombre')?.value.trim();
  const tipo    = document.getElementById('doc-tipo')?.value;
  const inst    = document.getElementById('doc-inst')?.value.trim();
  const sinVig  = document.getElementById('doc-sinvig')?.checked;
  const desde   = document.getElementById('doc-desde')?.value;
  const hasta   = document.getElementById('doc-hasta')?.value;
  const err     = document.getElementById('doc-err');
  const empId   = STATE.user?.empleado_id;
  if (!nombre) { err.textContent = 'El nombre del documento es obligatorio.'; return; }
  if (!sinVig && !hasta) { err.textContent = 'Selecciona la fecha de vigencia o marca "sin vigencia".'; return; }
  let ruta_pdf = null;
  if (STATE._doc_file) {
    err.textContent = 'Subiendo archivo...';
    ruta_pdf = await subirArchivoAPI(STATE._doc_file, `doc-${nombre.replace(/\s+/g,'-').toLowerCase().slice(0,30)}`);
    if (!ruta_pdf) { err.textContent = 'Error al subir el archivo. Intenta de nuevo.'; return; }
  }
  err.textContent = 'Guardando...';
  const params = new URLSearchParams({ nombre, institucion: inst || '' });
  if (tipo) params.set('tipo', tipo);
  if (!sinVig && hasta) params.set('fecha_vencimiento', hasta);
  if (desde) params.set('fecha_expedicion', desde);
  if (ruta_pdf) params.set('ruta_pdf', ruta_pdf);
  const r = await fetch(`${API}/empleados/${empId}/certificados?${params.toString()}`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${STATE.token}` }
  });
  if (!r.ok) { err.textContent = 'Error al guardar el documento.'; return; }
  closePanel(null, true);
  toast(`Documento "${nombre}" guardado`);
  renderMiPerfil();
}

async function eliminarDocumento(i) {
  const doc = STATE.perfil_docs[i];
  const empId = STATE.user?.empleado_id;
  if (doc?.id) {
    await fetch(`${API}/empleados/${empId}/certificados/${doc.id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${STATE.token}` }
    });
  }
  toast('Documento eliminado');
  renderMiPerfil();
}

function openCambiarPassword() {
  openPanel('Cambiar contraseña', `
    <div class="panel-section">
      <div class="panel-section-title">NUEVA CONTRASEÑA</div>
      <div class="field-row full"><div class="field-group"><label class="field-label">NUEVA CONTRASEÑA</label><input class="field-input" id="cp-nueva" type="password" placeholder="Mínimo 8 caracteres"></div></div>
      <div class="field-row full"><div class="field-group"><label class="field-label">CONFIRMAR CONTRASEÑA</label><input class="field-input" id="cp-conf" type="password" placeholder="Repite la contraseña"></div></div>
      <div id="cp-err" style="color:#ef4444;font-size:12px;margin-top:8px"></div>
    </div>`,
    `<button class="btn btn-ghost btn-sm" onclick="closePanel(null,true)">Cancelar</button><button class="btn btn-primary btn-sm" onclick="cambiarPassword()"><i class="ti ti-check" aria-hidden="true"></i> Guardar</button>`);
}

async function cambiarPassword() {
  const nueva = document.getElementById('cp-nueva')?.value;
  const conf  = document.getElementById('cp-conf')?.value;
  const err   = document.getElementById('cp-err');
  if (!nueva || nueva.length < 8) { err.textContent = 'Mínimo 8 caracteres.'; return; }
  if (nueva !== conf) { err.textContent = 'Las contraseñas no coinciden.'; return; }
  const r = await api('PUT', '/auth/auth/cambiar-password', { email: STATE.user.email, nueva_password: nueva });
  if (r) { closePanel(null,true); toast('Contraseña actualizada'); }
  else { err.textContent = 'Error al cambiar la contraseña.'; }
}

// ─── MI GANTT ─────────────────────────────────────────────────────────────────
async function renderMiGantt() {
  await loadProyectos();
  const empId = STATE.user?.empleado_id;
  const pry = STATE.proyectos.filter(p => (p.tecnicos_asignados||[]).includes(empId));
  const today = new Date();
  const dias = 30;
  const cols = Array.from({length:dias}, (_,i) => { const d = new Date(today); d.setDate(d.getDate()-7+i); return d; });
  html(`
    <div class="table-section">
      <div class="table-header"><span class="table-title">MIS PROYECTOS — 30 DÍAS</span><button class="btn btn-primary btn-sm" onclick="abrirCalendarioMensual('${empId}','${(STATE.user?.nombre||'Mi calendario').replace(/'/g,"\\'")}',0)"><i class="ti ti-calendar" aria-hidden="true"></i> Ver calendario mensual</button></div>
      ${pry.length===0?'<div class="empty-state"><i class="ti ti-calendar-off" aria-hidden="true"></i><p>Sin proyectos asignados</p></div>':`
      <div class="gantt-wrap">
        <table class="gantt-table">
          <thead><tr>
            <th style="min-width:160px">PROYECTO</th>
            ${cols.map(d=>`<th style="min-width:24px;text-align:center;${d.toDateString()===today.toDateString()?'color:var(--red)':''}">${d.getDate()}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${pry.map(p=>`<tr>
              <td class="gantt-name" style="font-size:11px">${p.nombre}</td>
              ${cols.map(d=>{
                const fi = p.fecha_inicio ? new Date(p.fecha_inicio) : null;
                const ff = p.fecha_fin_estimada ? new Date(p.fecha_fin_estimada) : null;
                const inRange = fi && ff && d >= fi && d <= ff;
                const isHoy = d.toDateString()===today.toDateString();
                const isWknd = d.getDay()===0||d.getDay()===6;
                let cls = isHoy?'gantt-cell today':isWknd?'gantt-cell weekend':'gantt-cell';
                if (inRange) cls += d < today ? ' past' : ' occupied';
                return `<td class="${cls}"></td>`;
              }).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`}
    </div>`);
}

// ─── AUTO-LOGIN ───────────────────────────────────────────────────────────────
(function() {
  const t = localStorage.getItem('w_token');
  const r = localStorage.getItem('w_rol');
  const n = localStorage.getItem('w_nombre');
  const e = localStorage.getItem('w_email');
  const ei = localStorage.getItem('w_emp_id');
  if (t && r && n) {
    STATE.token = t; STATE.rol = r;
    STATE.user = { nombre: n, email: e, empleado_id: ei };
    initApp();
  }
})();
</script>
